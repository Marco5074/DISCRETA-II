<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matemática discreta: memoria, repaso y ejercicios</title>
<style>
  :root { --fondo:#eef1f6; --tinta:#1b2433; --ok:#1f8a5b; --mal:#c8433b; --acento:#f0a500; --azul:#1f4fbf; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fondo); color:var(--tinta); font:16px/1.55 Verdana, sans-serif; }
  header { background:var(--tinta); padding:10px 12px; position:sticky; top:0; z-index:2; }
  header h1 { margin:0 0 8px; font-size:1.05rem; color:#fff; }
  .fila-tema { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .fila-tema label { color:#fff; font-size:.9rem; white-space:nowrap; }
  #menu { flex:1; min-width:0; font:inherit; padding:9px; border:2px solid #fff; border-radius:8px; background:#000; color:#fff; font-weight:bold; color-scheme:dark; }
  #menu option { background:#000; color:#fff; }
  #menu:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  #modos { display:flex; gap:6px; }
  #modos button { flex:1; font:inherit; font-size:.9rem; padding:8px; border:2px solid #9fb0cc; background:transparent; color:#fff; border-radius:8px; cursor:pointer; }
  #modos button[aria-selected="true"] { background:var(--acento); color:var(--tinta); border-color:var(--acento); font-weight:bold; }
  main { max-width:700px; margin:0 auto; padding:18px 16px 40px; }
  .tarjeta { background:#fff; border:2px solid var(--tinta); border-radius:10px; padding:18px; }
  button:focus-visible { outline:3px solid var(--acento); outline-offset:2px; }
  #progreso { opacity:.7; margin:0 0 8px; }
  .barra { height:8px; background:#cfd6e3; border-radius:4px; margin-bottom:14px; }
  .barra div { height:100%; width:0; background:var(--ok); border-radius:4px; transition:width .3s; }
  .etiqueta { font-size:.85rem; font-weight:bold; color:#6a5200; background:var(--acento); display:inline-block; padding:1px 10px; border-radius:10px; }
  #pregunta { font-size:1.1rem; font-weight:bold; margin:10px 0 0; }
  #def { margin:10px 0 0; padding:10px 12px; background:#f3f5fa; border-left:6px solid var(--tinta); border-radius:6px; }
  #opciones { display:grid; gap:8px; margin-top:14px; }
  #opciones button { font:inherit; text-align:left; padding:10px 12px; border:2px solid var(--tinta); background:#fff; color:var(--tinta); border-radius:8px; cursor:pointer; }
  #opciones button:hover:not(:disabled) { background:#f3f5fa; }
  #opciones button.ok { background:#dff3e9; border-color:var(--ok); font-weight:bold; }
  #opciones button.mal { background:#f9e0de; border-color:var(--mal); }
  #msg { margin-top:14px; padding:10px 12px; border-radius:8px; display:none; }
  #msg.ok { display:block; background:#dff3e9; border-left:6px solid var(--ok); }
  #msg.mal { display:block; background:#f9e0de; border-left:6px solid var(--mal); }
  .principal { margin-top:12px; width:100%; font:inherit; padding:10px 16px; border:2px solid var(--tinta); background:var(--tinta); color:#fff; border-radius:8px; cursor:pointer; }
  /* Repaso */
  #chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  #chips button { font:inherit; font-size:.85rem; min-width:36px; padding:4px 8px; border:2px solid var(--tinta); background:#fff; color:var(--tinta); border-radius:8px; cursor:pointer; }
  #chips button[aria-current="true"] { background:var(--tinta); color:#fff; }
  #rep h2 { margin:8px 0 8px; font-size:1.25rem; color:var(--azul); }
  #rep p { margin:6px 0; } #rep ul, #rep ol { margin:6px 0; padding-left:22px; } #rep li { margin:3px 0; }
  #rep pre { background:#eef1f6; border:1px solid #c5cde0; border-radius:6px; padding:10px; overflow-x:auto; font:13px/1.45 Consolas, Menlo, monospace; margin:8px 0; }
  #rep table { border-collapse:collapse; width:100%; margin:8px 0; font-size:.9rem; }
  #rep th, #rep td { border:1px solid #c5cde0; padding:6px 8px; text-align:left; vertical-align:top; }
  #rep th { background:#dfe7fb; } #rep td:first-child { background:#f3f5fa; font-weight:bold; }
  .extra { color:#b45309; font-weight:bold; } .nota { background:#fff3d1; border-left:6px solid var(--acento); padding:8px 10px; border-radius:6px; margin:8px 0; }
  .regla { background:#dfe7fb; border-left:6px solid var(--azul); padding:8px 10px; border-radius:6px; margin:8px 0; font-weight:bold; }
  .nav { display:flex; gap:8px; margin-top:12px; }
  .nav button { flex:1; font:inherit; padding:10px; border:2px solid var(--tinta); background:#fff; color:var(--tinta); border-radius:8px; cursor:pointer; }
  .nav button:disabled { opacity:.4; cursor:default; }
  svg { max-width:100%; height:auto; }
  #ej .hoja { margin-bottom:18px; } #ej h2 { margin:0 0 6px; font-size:1.2rem; color:var(--azul); }
  #ej .indic { color:#5b6477; font-size:.88rem; margin:4px 0; }
  #ej ol { list-style:none; padding:0; margin:10px 0 0; } #ej li.ejercicio { padding:10px 0; border-top:1px solid #d5dbe8; }
  #ej .num { display:inline-block; min-width:34px; font-weight:bold; color:var(--azul); } #ej .partes { margin:4px 0 0 34px; } #ej .partes p { margin:3px 0; }
</style>
</head>
<body>
<header>
  <h1>Matemática discreta</h1>
  <div class="fila-tema"><label for="menu">Tema:</label><select id="menu" aria-label="Elegir tema"></select></div>
  <div id="modos" role="tablist">
    <button id="m-mem" role="tab" aria-selected="true">Memoria</button>
    <button id="m-rep" role="tab" aria-selected="false">Repaso</button>
    <button id="m-ej" role="tab" aria-selected="false">Ejercicios</button>
  </div>
</header>
<main>
  <section id="mem">
    <p id="progreso"></p>
    <div class="barra"><div id="avance"></div></div>
    <div class="tarjeta">
      <span class="etiqueta" id="etq"></span>
      <p id="pregunta"></p>
      <div id="def"></div>
      <div id="opciones"></div>
      <div id="msg" role="status"></div>
      <button id="sig" class="principal" hidden>Siguiente</button>
    </div>
  </section>
  <section id="rep" hidden>
    <div id="chips"></div>
    <div class="tarjeta" id="contenido"></div>
    <div class="nav"><button id="ant">Anterior</button><button id="prox">Siguiente</button></div>
  </section>
  <section id="ej" hidden></section>
</main>

<script>
/* ---------- MEMORIA: [concepto, definición] ---------- */
const TEMAS = [{"n":"Inclusión/exclusión y función φ de Euler","c":[["Principio de inclusión/exclusión","Resuelve el caso general de contar la unión de conjuntos que se entrelazan (no son disjuntos): se suman los tamaños, se resta lo que se contó de más, se vuelve a sumar lo que se restó de más, y así alternando."],["Regla de la suma","Dice cuántos elementos hay en una unión de conjuntos, pero solo cuando los conjuntos son mutuamente disjuntos (no comparten elementos)."],["Universo (U)","El conjunto total de donde salen los elementos que se están contando, por ejemplo los enteros de 1 a 1000."],["Intersección (en conteo)","Los elementos que cumplen varias condiciones a la vez; son los que se cuentan más de una vez al sumar los tamaños de los conjuntos."],["Unión de dos conjuntos","|A ∪ B| = |A| + |B| − |A ∩ B|. Se usa cuando se piden los elementos que cumplen una condición o la otra (o ambas); la intersección se resta porque se contó dos veces."],["Unión de tres conjuntos","|A ∪ B ∪ C| = |A| + |B| + |C| − |A ∩ B| − |A ∩ C| − |B ∩ C| + |A ∩ B ∩ C|. La intersección triple se suma porque, sin ella, un elemento que está en los tres conjuntos contaría 3 − 3 = 0 veces y debe contar 1."],["Unión de n conjuntos (teorema general)","|A1 ∪ A2 ∪ ... ∪ An| = Σ (−1)^(k+1) Sk con k = 1, ..., n, es decir S1 − S2 + S3 − S4 + ... Los signos alternan porque un elemento que está en exactamente m conjuntos se cuenta C(m,1) − C(m,2) + C(m,3) − ... veces, y esa suma siempre da 1."],["Sk","Suma de los tamaños de todas las intersecciones posibles de k conjuntos de la colección; tiene C(n, k) términos (con n = 4: 4, 6, 4 y 1 términos)."],["Complemento (ninguno de los conjuntos)","Número de elementos que no están en ninguno de los n conjuntos: |A1' ∩ ... ∩ An'| = Σ (−1)^k Sk con k = 0, ..., n, es decir |U| − S1 + S2 − S3 + ... Es el universo menos la unión, por eso todos los signos de la unión se invierten."],["S0","Es |U|: la «intersección de cero conjuntos», es decir, no se impone ninguna condición y quedan todos los elementos del universo. Es el punto de partida del complemento: se cuenta todo y luego se quitan los que no sirven."],["Ley de De Morgan (en conteo)","A' ∩ B' = (A ∪ B)': «ni A ni B» es el complemento de la unión, por lo que |A' ∩ B'| = |U| − |A ∪ B| = |U| − |A| − |B| + |A ∩ B|."],["Traducción de palabras del enunciado","«o» o «al menos uno» → unión (∪); «y» → intersección (∩); «ni ... ni», «ninguno» o «no son» → complemento de la unión, que por De Morgan es la intersección de los complementos."],["Conteo de múltiplos en 1..N","La cantidad de múltiplos de d entre 1 y N es ⌊N/d⌋ (parte entera hacia abajo), porque los múltiplos son d·1, d·2, ..., d·q con q el mayor entero tal que d·q ≤ N. Ejemplo: ⌊1000/3⌋ = 333, no 334."],["Múltiplos de a y de b a la vez","Son los múltiplos de mcm(a, b); si a y b no comparten factores primos, mcm(a, b) = a × b (por eso los múltiplos de 3 y de 5 a la vez son los múltiplos de 15)."],["Criterios rápidos de divisibilidad","Divisible por 3 si la suma de sus dígitos es divisible por 3; divisible por 5 si termina en 0 o en 5; divisible por 15 si cumple ambos."],["Primos relativos (coprimos)","Dos enteros positivos cuyo único divisor común es 1, es decir, que no comparten ningún factor primo. Ejemplo: 6 = 2·3 y 35 = 5·7."],["Función φ de Euler (Totient)","Para un entero positivo n, φ(n) es el número de enteros de 1 a n que son primos relativos a n."],["φ(n) como problema de complemento","Se define un conjunto Ap por cada primo distinto p de n (los enteros de 1 a n divisibles por p); los primos relativos son los que no están en ninguno, o sea el corolario del complemento con U = {1, ..., n}. Solo importan los primos distintos: un primo con exponente (como 7² en 2695) sigue siendo un solo conjunto."],["Teorema para calcular φ(n) más rápido","Si p1, ..., pk son los distintos factores primos de n y P = p1·p2·...·pk, entonces φ(n) = (n / P)(p1 − 1)(p2 − 1)...(pk − 1). Ejemplo: φ(2695) = (2695/385)(4)(6)(10) = 1680."],["Algoritmo para calcular φ(n)","1) Factoriza n en primos. 2) Anota los primos distintos p1, ..., pk y su producto P. 3) Calcula (n/P)(p1 − 1)...(pk − 1). 4) Si piden justificar, usa inclusión/exclusión con un conjunto por cada primo."],["Algoritmo general de conteo (8 pasos)","1) Identificar el universo y |U|. 2) Definir un conjunto por cada condición. 3) Decidir si piden unión o complemento. 4) Calcular los tamaños individuales (S1). 5) Calcular las intersecciones (S2, S3, ...). 6) Aplicar la fórmula con signos alternados. 7) Verificar que el resultado esté entre 0 y |U|. 8) Interpretar el número en palabras."],["Errores frecuentes al contar","Olvidar restar la intersección; contar un primo repetido como dos conjuntos en φ(n); redondear mal los múltiplos; confundir «o» con «y»; en «ni ... ni» dar la unión en vez de |U| − unión; y equivocar los signos del complemento (empiezan con + para |U| y luego alternan − + −)."],["Idea central del conteo con repeticiones","No es memorizar fórmulas largas: es responder «¿cuántas veces conté cada elemento, y cómo lo corrijo para que cuente exactamente una vez?». Sumar − restar + sumar − restar ... (alternando)."]],"r":[{"t":"Principio de inclusión/exclusión","h":"<p>Resuelve el caso general de contar la unión de conjuntos que se entrelazan (no son disjuntos): se suman los tamaños, se resta lo que se contó de más, se vuelve a sumar lo que se restó de más, y así alternando.</p>"},{"t":"Regla de la suma","h":"<p>Dice cuántos elementos hay en una unión de conjuntos, pero solo cuando los conjuntos son mutuamente disjuntos (no comparten elementos).</p>"},{"t":"Universo (U)","h":"<p>El conjunto total de donde salen los elementos que se están contando, por ejemplo los enteros de 1 a 1000.</p>"},{"t":"Intersección (en conteo)","h":"<p>Los elementos que cumplen varias condiciones a la vez; son los que se cuentan más de una vez al sumar los tamaños de los conjuntos.</p>"},{"t":"Unión de dos conjuntos","h":"<p>|A ∪ B| = |A| + |B| − |A ∩ B|. Se usa cuando se piden los elementos que cumplen una condición o la otra (o ambas); la intersección se resta porque se contó dos veces.</p>"},{"t":"Unión de tres conjuntos","h":"<p>|A ∪ B ∪ C| = |A| + |B| + |C| − |A ∩ B| − |A ∩ C| − |B ∩ C| + |A ∩ B ∩ C|. La intersección triple se suma porque, sin ella, un elemento que está en los tres conjuntos contaría 3 − 3 = 0 veces y debe contar 1.</p>"},{"t":"Unión de n conjuntos (teorema general)","h":"<p>|A1 ∪ A2 ∪ ... ∪ An| = Σ (−1)^(k+1) Sk con k = 1, ..., n, es decir S1 − S2 + S3 − S4 + ... Los signos alternan porque un elemento que está en exactamente m conjuntos se cuenta C(m,1) − C(m,2) + C(m,3) − ... veces, y esa suma siempre da 1.</p>"},{"t":"Sk","h":"<p>Suma de los tamaños de todas las intersecciones posibles de k conjuntos de la colección; tiene C(n, k) términos (con n = 4: 4, 6, 4 y 1 términos).</p>"},{"t":"Complemento (ninguno de los conjuntos)","h":"<p>Número de elementos que no están en ninguno de los n conjuntos: |A1' ∩ ... ∩ An'| = Σ (−1)^k Sk con k = 0, ..., n, es decir |U| − S1 + S2 − S3 + ... Es el universo menos la unión, por eso todos los signos de la unión se invierten.</p>"},{"t":"S0","h":"<p>Es |U|: la «intersección de cero conjuntos», es decir, no se impone ninguna condición y quedan todos los elementos del universo. Es el punto de partida del complemento: se cuenta todo y luego se quitan los que no sirven.</p>"},{"t":"Ley de De Morgan (en conteo)","h":"<p>A' ∩ B' = (A ∪ B)': «ni A ni B» es el complemento de la unión, por lo que |A' ∩ B'| = |U| − |A ∪ B| = |U| − |A| − |B| + |A ∩ B|.</p>"},{"t":"Traducción de palabras del enunciado","h":"<p>«o» o «al menos uno» → unión (∪); «y» → intersección (∩); «ni ... ni», «ninguno» o «no son» → complemento de la unión, que por De Morgan es la intersección de los complementos.</p>"},{"t":"Conteo de múltiplos en 1..N","h":"<p>La cantidad de múltiplos de d entre 1 y N es ⌊N/d⌋ (parte entera hacia abajo), porque los múltiplos son d·1, d·2, ..., d·q con q el mayor entero tal que d·q ≤ N. Ejemplo: ⌊1000/3⌋ = 333, no 334.</p>"},{"t":"Múltiplos de a y de b a la vez","h":"<p>Son los múltiplos de mcm(a, b); si a y b no comparten factores primos, mcm(a, b) = a × b (por eso los múltiplos de 3 y de 5 a la vez son los múltiplos de 15).</p>"},{"t":"Criterios rápidos de divisibilidad","h":"<p>Divisible por 3 si la suma de sus dígitos es divisible por 3; divisible por 5 si termina en 0 o en 5; divisible por 15 si cumple ambos.</p>"},{"t":"Primos relativos (coprimos)","h":"<p>Dos enteros positivos cuyo único divisor común es 1, es decir, que no comparten ningún factor primo. Ejemplo: 6 = 2·3 y 35 = 5·7.</p>"},{"t":"Función φ de Euler (Totient)","h":"<p>Para un entero positivo n, φ(n) es el número de enteros de 1 a n que son primos relativos a n.</p>"},{"t":"φ(n) como problema de complemento","h":"<p>Se define un conjunto Ap por cada primo distinto p de n (los enteros de 1 a n divisibles por p); los primos relativos son los que no están en ninguno, o sea el corolario del complemento con U = {1, ..., n}. Solo importan los primos distintos: un primo con exponente (como 7² en 2695) sigue siendo un solo conjunto.</p>"},{"t":"Teorema para calcular φ(n) más rápido","h":"<p>Si p1, ..., pk son los distintos factores primos de n y P = p1·p2·...·pk, entonces φ(n) = (n / P)(p1 − 1)(p2 − 1)...(pk − 1). Ejemplo: φ(2695) = (2695/385)(4)(6)(10) = 1680.</p>"},{"t":"Algoritmo para calcular φ(n)","h":"<p>1) Factoriza n en primos. 2) Anota los primos distintos p1, ..., pk y su producto P. 3) Calcula (n/P)(p1 − 1)...(pk − 1). 4) Si piden justificar, usa inclusión/exclusión con un conjunto por cada primo.</p>"},{"t":"Algoritmo general de conteo (8 pasos)","h":"<p>1) Identificar el universo y |U|. 2) Definir un conjunto por cada condición. 3) Decidir si piden unión o complemento. 4) Calcular los tamaños individuales (S1). 5) Calcular las intersecciones (S2, S3, ...). 6) Aplicar la fórmula con signos alternados. 7) Verificar que el resultado esté entre 0 y |U|. 8) Interpretar el número en palabras.</p>"},{"t":"Errores frecuentes al contar","h":"<p>Olvidar restar la intersección; contar un primo repetido como dos conjuntos en φ(n); redondear mal los múltiplos; confundir «o» con «y»; en «ni ... ni» dar la unión en vez de |U| − unión; y equivocar los signos del complemento (empiezan con + para |U| y luego alternan − + −).</p>"},{"t":"Idea central del conteo con repeticiones","h":"<p>No es memorizar fórmulas largas: es responder «¿cuántas veces conté cada elemento, y cómo lo corrijo para que cuente exactamente una vez?». Sumar − restar + sumar − restar ... (alternando).</p>"},{"t":"Tipos de problema de inclusión/exclusión","h":"<table><tr><th>Tipo</th><th>Cómo reconocerlo</th><th>Idea principal</th></tr><tr><td>1. Unión de 2 conjuntos</td><td>«múltiplos de 3 o de 5», «cumple al menos una de dos condiciones»</td><td>|A| + |B| − |A ∩ B|</td></tr><tr><td>2. Unión de 3 conjuntos</td><td>Tres condiciones unidas con «o»</td><td>Sumar individuales, restar parejas, sumar la triple</td></tr><tr><td>3. Unión de n conjuntos</td><td>Cuatro o más condiciones (teorema general)</td><td>S1 − S2 + S3 − ..., signos alternados</td></tr><tr><td>4. Complemento</td><td>«no son múltiplos de ... ni de ...», «ninguno», «no divisible por»</td><td>|U| − (unión), o el corolario Σ(−1)^k Sk</td></tr><tr><td>5. Función φ de Euler</td><td>«primos relativos a n», «coprimos con n», «φ(n)»</td><td>Complemento con un conjunto por cada primo distinto de n</td></tr><tr><td>Especial: múltiplos</td><td>«múltiplos de», «divisibles por» dentro de 1, 2, ..., N</td><td>|Ad| = ⌊N/d⌋; la intersección son los múltiplos del mcm</td></tr></table>"},{"t":"Ejemplo · Múltiplos de 3 o de 5 entre 1 y 1000","h":"<p>a) ¿Cuántos enteros de 1 a 1000 son múltiplos de 3 o de 5? b) ¿Cuántos no son múltiplos de 3 ni de 5?</p><table><tr><th>Conjunto</th><th>Cómo se cuenta</th><th>Tamaño</th></tr><tr><td>A (múltiplos de 3)</td><td>3(1), 3(2), ..., 3(333) = 999</td><td>|A| = 333</td></tr><tr><td>B (múltiplos de 5)</td><td>5(1), ..., 5(200) = 1000</td><td>|B| = 200</td></tr><tr><td>A ∩ B (múltiplos de 15)</td><td>15(1), ..., 15(66) = 990</td><td>|A ∩ B| = 66</td></tr></table><p><b>a)</b> |A ∪ B| = 333 + 200 − 66 = <b>467</b>.</p><p><b>b)</b> Complemento: 1000 − 467 = <b>533</b>. Comprobación con el corolario: 1000 − 333 − 200 + 66 = 533.</p><p>De dónde sale cada número: 333 = ⌊1000/3⌋ (3 × 333 = 999 y 3 × 334 = 1002 > 1000); 200 = 1000/5 exacto; 66 = ⌊1000/15⌋ = ⌊66.67⌋ (15 × 66 = 990 y 15 × 67 = 1005 > 1000). Se resta 66 porque los múltiplos de 15 se contaron en los 333 y también en los 200. Criterios: 996 tiene dígitos 9 + 9 + 6 = 24, divisible por 3; 975 termina en 5 y 9 + 7 + 5 = 21, múltiplo de 15.</p><div class=\"regla\">Respuesta: a) 467 enteros de 1 a 1000 son múltiplos de 3 o de 5. b) 533 enteros no son múltiplos de 3 ni de 5.</div>"},{"t":"Ejemplo · Unión de 4 conjuntos","h":"<p>|A1 ∪ A2 ∪ A3 ∪ A4| = S1 − S2 + S3 − S4.</p><table><tr><th>k</th><th>Qué suma Sk</th><th>Términos</th><th>Signo</th></tr><tr><td>1</td><td>|A1| + |A2| + |A3| + |A4|</td><td>C(4,1) = 4</td><td>+</td></tr><tr><td>2</td><td>todas las intersecciones de a 2</td><td>C(4,2) = 6</td><td>−</td></tr><tr><td>3</td><td>todas las intersecciones de a 3</td><td>C(4,3) = 4</td><td>+</td></tr><tr><td>4</td><td>|A1 ∩ A2 ∩ A3 ∩ A4|</td><td>C(4,4) = 1</td><td>−</td></tr></table><p>¿Por qué los signos alternan? Un elemento que está en exactamente 4 conjuntos se cuenta 4 − 6 + 4 − 1 = 1 vez. El signo es (−1)^(k+1): para k = 1 el exponente es 2 y el signo es +.</p>"},{"t":"Ejemplo · φ(2695) con inclusión/exclusión","h":"<p>Calcular φ(2695), es decir, cuántos enteros de 1 a 2695 son primos relativos a 2695, usando inclusión/exclusión.</p><p>U = {1, 2, ..., 2695}; 2695 = 5 · 7² · 11. Se quieren los enteros que no son divisibles por 5, 7 ni 11: A5, A7 y A11 (3 conjuntos, porque el 7 al cuadrado sigue siendo una sola condición).</p><table><tr><th>Cantidad</th><th>Cálculo</th><th>Valor</th></tr><tr><td>S0 = |U|</td><td>—</td><td>2695</td></tr><tr><td>S1</td><td>2695/5 + 2695/7 + 2695/11 = 539 + 385 + 245</td><td>1169</td></tr><tr><td>S2</td><td>2695/35 + 2695/55 + 2695/77 = 77 + 49 + 35</td><td>161</td></tr><tr><td>S3</td><td>2695/(5·7·11) = 2695/385</td><td>7</td></tr></table><p>S0 − S1 + S2 − S3 = 2695 − 1169 + 161 − 7 = <b>1680</b>, así que φ(2695) = 1680. Las divisiones son exactas porque 5, 7 y 11 dividen a 2695; y la intersección divide entre el producto porque son primos distintos.</p><div class=\"regla\">Respuesta: φ(2695) = 1680: hay 1680 enteros de 1 a 2695 que son primos relativos a 2695.</div>"},{"t":"Ejemplo · φ con la fórmula rápida (2695 y 1000)","h":"<p>Calcular φ(2695) y φ(1000) con la fórmula rápida y comprobar φ(1000) con inclusión/exclusión.</p><p><b>φ(2695):</b> primos distintos 5, 7, 11; P = 385; φ(2695) = (2695/385)(5 − 1)(7 − 1)(11 − 1) = 7 · 4 · 6 · 10 = 1680.</p><p><b>φ(1000):</b> 1000 = 2³ · 5³; primos distintos 2 y 5; P = 10; φ(1000) = (1000/10)(2 − 1)(5 − 1) = 100 · 1 · 4 = <b>400</b>. Comprobación con inclusión/exclusión: 500 múltiplos de 2, 200 de 5 y 100 de 10 → 1000 − 500 − 200 + 100 = 400.</p><p>¿De dónde sale la fórmula? Con dos primos, el corolario da φ(n) = n − n/p1 − n/p2 + n/(p1p2) = n(1 − 1/p1)(1 − 1/p2) = (n / (p1p2))(p1 − 1)(p2 − 1). Los exponentes no cambian los conjuntos Ap, por eso no aparecen. La fórmula es más rápida y sirve para verificar; si piden mostrar el proceso, se usa inclusión/exclusión como en φ(2695).</p><div class=\"regla\">Respuesta: φ(2695) = 1680 y φ(1000) = 400.</div>"}]},{"n":"Principio del palomar","c":[["Principio del palomar","Si colocamos más objetos que categorías disponibles, necesariamente alguna categoría tendrá más de un objeto. Se demuestra por contradicción: si cada hueco tuviera como máximo 1 paloma, habría como máximo m palomas, pero hay más."],["Palomas","Los objetos que se están distribuyendo o clasificando (personas, enteros, canicas, puntos, consonantes...)."],["Huecos","Las categorías o lugares donde pueden caer las palomas: los valores posibles de la característica que debe repetirse. Su cantidad se llama m."],["Huecos vacíos","Un hueco puede quedar vacío y el principio sigue valiendo: no ayudan a nadie, solo obligan a que otros huecos se llenen más."],["Truco para encontrar los huecos","Preguntarse «¿qué característica tienen que compartir?»: todos los valores que esa característica puede tomar son los huecos (misma inicial → las 26 letras; mismo residuo al dividir entre 3 → 0, 1 y 2; mismo color → los colores)."],["Peor caso","La mayor cantidad de objetos que se puede tener sin que todavía se cumpla lo que piden: para evitar r objetos en un hueco se colocan r − 1 en cada uno. La siguiente paloma lo rompe, por eso después se agrega 1."],["Fórmula del palomar sin límites","N = m(r − 1) + 1: con m huecos y el objetivo de garantizar r objetos en uno mismo, el peor caso es m(r − 1) y se suma 1 porque cualquier paloma extra lleva algún hueco de r − 1 a r."],["Fórmula del palomar con límites","N = m(r − 1) − C + 1, donde C es la suma de las correcciones de las categorías que no tienen suficientes objetos para llegar a r − 1. Si no hay límites, C = 0."],["Corrección (problemas con límites)","Para una categoría limitada es (r − 1) − cantidad disponible; solo se aplica cuando lo disponible es menor que r − 1 (si no, vale 0). Representa las unidades que el cálculo ideal suponía tener pero que realmente no existen."],["Forma con la función techo","⌈n/m⌉ ≥ r ocurre cuando n/m > r − 1, es decir n > m(r − 1), o sea n ≥ m(r − 1) + 1: es exactamente la misma fórmula del peor caso, escrita con el techo."],["Palomar tipo 1: coincidencia","Demostrar que dos objetos comparten una característica: basta ver que hay más palomas que huecos. Ejemplo: 4 enteros y los 3 residuos posibles al dividir entre 3."],["Palomar tipo 2: cantidad mínima","Garantizar r objetos en la misma categoría: se construye el peor caso (r − 1 por hueco) y se suma 1."],["Palomar tipo 3: con límites","Hay cantidades máximas por categoría («exactamente 5 rojas, 8 azules...»): se construye el peor caso respetando los límites y se aplican correcciones."],["Palomar tipo 4: geométrico","Las palomas son puntos y los huecos son regiones de una figura. Los huecos no vienen dados: hay que inventarlos dividiendo la figura para que cada región cumpla lo que se pide (9 puntos y 4 triángulos pequeños de área 1/8)."],["Palomar tipo especial: secciones","Palabras como «consecutivos», «espacios» o «entre vocales» indican que lo que separa (las vocales) crea los pedazos, y los pedazos son los huecos. Regla: m = vocales + 1; si la lista empieza con vocal, el primer hueco queda vacío y m baja en 1."],["Algoritmo del palomar (9 pasos)","1) Identificar las palomas. 2) Identificar los huecos. 3) Determinar m. 4) Determinar el objetivo r. 5) Buscar límites de disponibilidad. 6) Construir el peor caso: r − 1 por hueco. 7) Aplicar correcciones (r − 1) − disponible. 8) Agregar una unidad. 9) Interpretar qué garantiza el número."],["Idea central del palomar","No es memorizar fórmulas: es responder «¿cuál es la mayor cantidad de objetos que puedo tener sin que todavía se cumpla lo que me piden?». Después se hace peor caso + 1."]],"r":[{"t":"Principio del palomar","h":"<p>Si colocamos más objetos que categorías disponibles, necesariamente alguna categoría tendrá más de un objeto. Se demuestra por contradicción: si cada hueco tuviera como máximo 1 paloma, habría como máximo m palomas, pero hay más.</p>"},{"t":"Palomas","h":"<p>Los objetos que se están distribuyendo o clasificando (personas, enteros, canicas, puntos, consonantes...).</p>"},{"t":"Huecos","h":"<p>Las categorías o lugares donde pueden caer las palomas: los valores posibles de la característica que debe repetirse. Su cantidad se llama m.</p>"},{"t":"Huecos vacíos","h":"<p>Un hueco puede quedar vacío y el principio sigue valiendo: no ayudan a nadie, solo obligan a que otros huecos se llenen más.</p>"},{"t":"Truco para encontrar los huecos","h":"<p>Preguntarse «¿qué característica tienen que compartir?»: todos los valores que esa característica puede tomar son los huecos (misma inicial → las 26 letras; mismo residuo al dividir entre 3 → 0, 1 y 2; mismo color → los colores).</p>"},{"t":"Peor caso","h":"<p>La mayor cantidad de objetos que se puede tener sin que todavía se cumpla lo que piden: para evitar r objetos en un hueco se colocan r − 1 en cada uno. La siguiente paloma lo rompe, por eso después se agrega 1.</p>"},{"t":"Fórmula del palomar sin límites","h":"<p>N = m(r − 1) + 1: con m huecos y el objetivo de garantizar r objetos en uno mismo, el peor caso es m(r − 1) y se suma 1 porque cualquier paloma extra lleva algún hueco de r − 1 a r.</p>"},{"t":"Fórmula del palomar con límites","h":"<p>N = m(r − 1) − C + 1, donde C es la suma de las correcciones de las categorías que no tienen suficientes objetos para llegar a r − 1. Si no hay límites, C = 0.</p>"},{"t":"Corrección (problemas con límites)","h":"<p>Para una categoría limitada es (r − 1) − cantidad disponible; solo se aplica cuando lo disponible es menor que r − 1 (si no, vale 0). Representa las unidades que el cálculo ideal suponía tener pero que realmente no existen.</p>"},{"t":"Forma con la función techo","h":"<p>⌈n/m⌉ ≥ r ocurre cuando n/m &gt; r − 1, es decir n &gt; m(r − 1), o sea n ≥ m(r − 1) + 1: es exactamente la misma fórmula del peor caso, escrita con el techo.</p>"},{"t":"Palomar tipo 1: coincidencia","h":"<p>Demostrar que dos objetos comparten una característica: basta ver que hay más palomas que huecos. Ejemplo: 4 enteros y los 3 residuos posibles al dividir entre 3.</p>"},{"t":"Palomar tipo 2: cantidad mínima","h":"<p>Garantizar r objetos en la misma categoría: se construye el peor caso (r − 1 por hueco) y se suma 1.</p>"},{"t":"Palomar tipo 3: con límites","h":"<p>Hay cantidades máximas por categoría («exactamente 5 rojas, 8 azules...»): se construye el peor caso respetando los límites y se aplican correcciones.</p>"},{"t":"Palomar tipo 4: geométrico","h":"<p>Las palomas son puntos y los huecos son regiones de una figura. Los huecos no vienen dados: hay que inventarlos dividiendo la figura para que cada región cumpla lo que se pide (9 puntos y 4 triángulos pequeños de área 1/8).</p>"},{"t":"Palomar tipo especial: secciones","h":"<p>Palabras como «consecutivos», «espacios» o «entre vocales» indican que lo que separa (las vocales) crea los pedazos, y los pedazos son los huecos. Regla: m = vocales + 1; si la lista empieza con vocal, el primer hueco queda vacío y m baja en 1.</p>"},{"t":"Algoritmo del palomar (9 pasos)","h":"<p>1) Identificar las palomas. 2) Identificar los huecos. 3) Determinar m. 4) Determinar el objetivo r. 5) Buscar límites de disponibilidad. 6) Construir el peor caso: r − 1 por hueco. 7) Aplicar correcciones (r − 1) − disponible. 8) Agregar una unidad. 9) Interpretar qué garantiza el número.</p>"},{"t":"Idea central del palomar","h":"<p>No es memorizar fórmulas: es responder «¿cuál es la mayor cantidad de objetos que puedo tener sin que todavía se cumpla lo que me piden?». Después se hace peor caso + 1.</p>"},{"t":"Tipos de problema del palomar","h":"<table><tr><th>Tipo</th><th>Cómo reconocerlo</th><th>Idea principal</th></tr><tr><td>1. Coincidencia</td><td>«Dos tienen la misma característica», «¿debe haber dos...?»</td><td>Más palomas que huecos</td></tr><tr><td>2. Cantidad mínima</td><td>«Garantizar r objetos en la misma categoría»</td><td>Construir el peor caso y sumar 1</td></tr><tr><td>3. Con límites</td><td>Cantidades máximas: «exactamente 5 rojas, 8 azules...»</td><td>Peor caso respetando los límites y aplicar correcciones</td></tr><tr><td>4. Geométrico</td><td>Puntos dentro de figuras o regiones</td><td>Dividir la figura en huecos convenientes</td></tr><tr><td>Especial: secciones</td><td>«Consecutivos», «espacios», «entre vocales»</td><td>Las secciones funcionan como huecos</td></tr></table>"},{"t":"Ejemplo · 4 enteros y residuos al dividir entre 3","h":"<p>Se escogen 4 enteros cualesquiera. Mostrar que dos de ellos tienen el mismo residuo al dividir entre 3. ¿Y si fueran solo 3 enteros?</p><p>Palomas: los 4 enteros (n = 4). Huecos: los residuos 0, 1 y 2 (m = 3). Como 4 > 3, algún hueco recibe al menos dos enteros: <b>dos enteros tienen el mismo residuo</b> (⌈4/3⌉ = 2).</p><p>¿Y con solo 3 enteros? n = 3 y m = 3, ⌈3/3⌉ = 1: no se garantiza nada. Por ejemplo 3, 4 y 5 tienen residuos 0, 1 y 2.</p><div class=\"regla\">Respuesta: sí: entre 4 enteros cualesquiera hay dos con el mismo residuo al dividir entre 3; con solo 3 enteros no se garantiza.</div>"},{"t":"Ejemplo · 85 personas y la inicial del apellido","h":"<p>Verificar que en un grupo de 85 personas, al menos 4 deben tener la misma inicial del apellido.</p><p>Palomas: n = 85. Huecos: m = 26 letras. ⌈85/26⌉ = ⌈3.27⌉ = 4.</p><p>Peor caso: 26 × 3 = 78 personas podrían tener como máximo 3 por inicial; la persona 79 obliga a que alguna letra tenga 4. Como 85 ≥ 79, está garantizado.</p><div class=\"regla\">Respuesta: sí: con 85 personas, al menos 4 tienen la misma inicial del apellido.</div>"},{"t":"Ejemplo · 5 estudiantes en la misma clase","h":"<p>Hay 4 clases (Matemática, Física, Química y Biología) y cada estudiante pertenece a una. ¿Cuántos estudiantes hay que escoger para garantizar 5 en una misma clase?</p><p>Huecos: 4 clases, m = 4. Objetivo: 5 estudiantes en una misma clase, r = 5. Sin llegar a 5 caben 5 − 1 = 4 por clase: 4 × 4 = 16 pueden quedar 4, 4, 4, 4. El estudiante 17 lleva alguna clase a 5. <b>Respuesta: 17.</b></p><p>Con el techo: ⌈n/4⌉ = 5 cuando n/4 > 4, es decir n > 16; el mínimo es 17.</p>"},{"t":"Ejemplo · Canicas con límites (5 rojas, 8 azules, 10 blancas, 12 verdes, 7 amarillas)","h":"<p>Una bolsa tiene 5 canicas rojas, 8 azules, 10 blancas, 12 verdes y 7 amarillas. ¿Cuál es el mínimo de canicas que hay que sacar para garantizar que haya a) 4, b) 7 y c) 9 canicas del mismo color?</p>\n<p><b>Qué significa cada letra</b></p>\n<ul>\n<li><b>r:</b> cuántas canicas del mismo color se quieren garantizar (4, 7 o 9, según el inciso).</li>\n<li><b>m = 5:</b> los 5 colores (los huecos).</li>\n<li><b>Disponibles:</b> rojas 5, azules 8, blancas 10, verdes 12, amarillas 7.</li>\n<li><b>Corrección:</b> (r − 1) − disponibles, solo si disponibles &lt; r − 1; si no, vale 0. C es la suma de las correcciones.</li>\n<li><b>N = m(r − 1) − C + 1:</b> la cantidad mínima que garantiza el objetivo.</li>\n</ul>\n<div class=\"nota\"><b>¿Por qué r = 4, 7 y 9?</b> Porque cada inciso pide un objetivo distinto, y así se ve cómo aparecen las correcciones: con r = 4 ningún color se queda corto; con r = 7 solo el rojo (5 &lt; 6); con r = 9 se quedan cortos el rojo y el amarillo.</div>\n<p><b>Inciso a) r = 4</b></p>\n<ol>\n<li><b>Peor caso:</b> para evitar 4 se colocan 4 − 1 = 3 de cada color: 3 × 5 = 15.</li>\n<li><b>Límites:</b> todos los colores tienen al menos 3 (el menor es el rojo, con 5): sin correcciones, C = 0.</li>\n<li><b>Agregar uno:</b> N = 15 − 0 + 1 = 16.</li>\n</ol>\n<div class=\"regla\">Respuesta a): hay que sacar 16 canicas.</div>\n<p><b>Inciso b) r = 7</b></p>\n<ol>\n<li><b>Peor caso ideal:</b> 7 − 1 = 6 de cada color: 6 × 5 = 30.</li>\n<li><b>Límites:</b> el rojo tiene solo 5 &lt; 6, así que su corrección es 6 − 5 = 1. Azul (8), blanca (10), verde (12) y amarilla (7) tienen al menos 6: corrección 0.</li>\n<li><b>Total de correcciones:</b> C = 1.</li>\n<li><b>Agregar uno:</b> N = 30 − 1 + 1 = 30.</li>\n<li><b>Comprobar directo:</b> el peor caso real es 5 + 6 + 6 + 6 + 6 = 29; la canica 30 obliga a llegar a 7.</li>\n</ol>\n<div class=\"regla\">Respuesta b): hay que sacar 30 canicas.</div>\n<p><b>Inciso c) r = 9</b></p>\n<ol>\n<li><b>Peor caso ideal:</b> 9 − 1 = 8 de cada color: 8 × 5 = 40.</li>\n<li><b>Límites, color por color:</b>\n<ul>\n<li>Roja: 5 &lt; 8, corrección 8 − 5 = 3.</li>\n<li>Amarilla: 7 &lt; 8, corrección 8 − 7 = 1.</li>\n<li>Azul: tiene justo 8, caben las 8 en el peor caso: corrección 0.</li>\n<li>Blanca (10) y verde (12): les sobra: corrección 0.</li>\n</ul></li>\n<li><b>Total de correcciones:</b> C = 3 + 1 = 4.</li>\n<li><b>Agregar uno:</b> N = 40 − 4 + 1 = 37.</li>\n<li><b>Comprobar directo:</b> el peor caso real es 5 + 8 + 8 + 8 + 7 = 36; la canica 37 obliga a llegar a 9.</li>\n</ol>\n<div class=\"regla\">Respuesta c): hay que sacar 37 canicas.</div>"},{"t":"Ejemplo · La máquina de chicles","h":"<p>Una tienda tiene una máquina con un gran número de chicles rojos, verdes, azules y blancos. Si usted compra cualquier número de chicles y obtiene 13 o más del mismo color, la tienda le devuelve $5. Cada chicle cuesta $0.05. ¿Cuál es el número más pequeño de chicles que debe comprar para estar 100% seguro de ganar dinero con el trato?</p>\n<ol>\n<li><b>Huecos:</b> los 4 colores, así que m = 4.</li>\n<li><b>Límites:</b> hay «un gran número» de cada color, no hay límites y no hay correcciones (C = 0).</li>\n<li><b>Objetivo:</b> ganar con 13 o más del mismo color, así que r = 13.</li>\n<li><b>Peor caso:</b> 12 de cada color sin llegar a 13: 4 × 12 = 48 chicles.</li>\n<li><b>Agregar uno:</b> N = m(r − 1) + 1 = 4 · 12 + 1 = <b>49 chicles</b>. Con el techo: ⌈n/4⌉ ≥ 13 cuando n &gt; 48.</li>\n<li><b>Costo:</b> 49 × $0.05 = $2.45.</li>\n<li><b>Interpretar:</b> con 49 chicles se garantiza ganar y se reciben $5, así que conviene aceptar el trato.</li>\n</ol>"},{"t":"Ejemplo · Geométrico: 9 puntos en un triángulo","h":"<p>Nueve puntos se colocan al azar en un triángulo rectángulo (de catetos 1). Mostrar que 3 de esos puntos forman un triángulo de área 1/8 o menos (se permiten triángulos de área 0 si los tres puntos están en una recta).</p>\n<ol>\n<li><b>Palomas:</b> los 9 puntos, así que n = 9.</li>\n<li><b>Huecos (hay que inventarlos):</b> se divide el triángulo en 4 triángulos rectángulos de catetos 1/2 y 1/2, así que m = 4.</li>\n<li><b>Área de cada hueco:</b> (1/2 × 1/2) / 2 = 1/8.</li>\n<li><b>Aplicar el palomar:</b> ⌈9/4⌉ = 3, así que algún triángulo pequeño tiene 3 o más puntos.</li>\n<li><b>Concluir:</b> esos 3 puntos están dentro de un triángulo de área 1/8, por lo tanto el triángulo que forman tiene área ≤ 1/8.</li>\n</ol>\n<div class=\"nota\"><b>¿Por qué 4 regiones?</b>\n<ul>\n<li>El triángulo grande tiene área (1 × 1)/2 = 1/2; entre 4 partes iguales cada una mide 1/8.</li>\n<li>Con 5 regiones: ⌈9/5⌉ = 2, no alcanza para tener 3 puntos en una misma región.</li>\n<li>Con menos de 4 regiones, cada región tendría área mayor que 1/8.</li>\n</ul></div>"},{"t":"Ejemplo · Consonantes consecutivas (vocales como separadores)","h":"<p><b>a)</b> Las 5 vocales cortan la lista en 6 pedazos (m = vocales + 1 = 6): _A_I_O_U_E_. Palomas: 26 − 5 = 21 consonantes. ⌈21/6⌉ = ⌈3.5⌉ = 4: algún espacio contiene al menos <b>4 consonantes consecutivas</b>.</p><p><b>b)</b> Si la lista empieza con vocal, antes de ella no hay nada: queda m = 5 huecos. ⌈21/5⌉ = ⌈4.2⌉ = 5: hay una sublista con <b>5 o más consonantes consecutivas</b>. Con las mismas consonantes en menos huecos, cada hueco carga más.</p>"}]},{"n":"Probabilidad condicional","c":[["Probabilidad condicional","P(A | B) = P(A ∩ B) / P(B), con P(B) > 0: la probabilidad de A dado que B ocurrió. A (izquierda de la barra) es el evento cuya probabilidad se quiere calcular; B (derecha) es la condición, lo que ya se sabe que ocurrió."],["Universo reducido","Al saber que B ocurrió, el mundo de posibilidades se reduce a B: ese es el nuevo universo, y dentro de él se pregunta qué fracción cumple también A (los resultados de A ∩ B). Por eso se divide entre P(B)."],["La condicional no es simétrica","P(A | B) casi nunca es igual a P(B | A): cambiar de lado de la barra cambia el universo. Ejemplo: P(mamífero | perro) = 1, pero P(perro | mamífero) es muy pequeña."],["Intersección A ∩ B","Que ocurran los dos eventos a la vez: son los resultados que pertenecen a A y a B al mismo tiempo. En un espacio equiprobable, P(A ∩ B) = casos favorables / casos posibles."],["Eventos mutuamente excluyentes","Eventos que no pueden ocurrir al mismo tiempo: A ∩ B = ∅, es decir P(A ∩ B) = 0. No son lo mismo que independientes: con probabilidad mayor que 0 son muy dependientes, porque si ocurre uno se sabe con certeza que el otro no."],["Fórmula de la unión","P(A ∪ B) = P(A) + P(B) − P(A ∩ B): se resta la intersección porque al sumar P(A) y P(B) esos resultados se contaron dos veces. Si son mutuamente excluyentes queda solo la suma."],["Regla del producto","P(A ∩ B) = P(A) · P(B | A), o también P(B) · P(A | B). Es la fórmula de la condicional despejada y funciona siempre, con eventos dependientes e independientes."],["Eventos independientes","Saber que uno ocurrió no cambia la probabilidad del otro: P(A ∩ B) = P(A) · P(B) ⇔ P(A | B) = P(A) ⇔ P(B | A) = P(B). Cuando hay duda se calcula, porque la intuición puede engañar."],["Eventos dependientes","Eventos en los que saber que uno ocurrió sí cambia la probabilidad del otro; su intersección se calcula con P(A) · P(B | A)."],["Extracción sin reemplazo","La bola extraída no se devuelve, así que la urna cambia (menos bolas y otra proporción de colores) y el primer saque afecta al segundo: eventos dependientes, P(A) · P(B | A)."],["Extracción con reemplazo","Se devuelve la bola, la urna siempre queda igual y los saques son independientes: P(A) · P(B)."],["Independencia y complementos","Si A y B son independientes, también lo son A y B', A' y B, y A' y B'; por ejemplo P(A ∩ B') = P(A) · (1 − P(B)). Límite: no dice nada sobre A y otro evento D; para cada par nuevo hay que verificar de nuevo."],["Cinco caminos para obtener P(A ∩ B)","1) Espacio muestral que se puede listar: contar los resultados en ambos y dividir entre el total. 2) Independientes: P(A) · P(B). 3) Dependientes: P(A) · P(B | A). 4) Si dan la unión: P(A) + P(B) − P(A ∪ B). 5) Mutuamente excluyentes: 0."],["Orden de trabajo con espacio muestral","1) Escribe el espacio muestral completo. 2) Lista los resultados de cada evento y calcula P(A) y P(B). 3) A ∩ B son los resultados que aparecen en ambos. 4) Calcula la condicional. 5) Después verifica la independencia comparando P(A ∩ B) con P(A) · P(B). Primero se cuenta, luego se verifica."],["Intersección vs. condicional en el enunciado","Con «dado que», «sabiendo que» o «si...» piden una condicional (un solo paso: no se multiplica por P(A)); con «ambas», «las dos», «y» o «tanto... como...» piden una intersección (universo reducido y luego producto)."],["Dos formas de calcular una condicional","Forma 1: fórmula con la intersección contada, P(A ∩ B) / P(B). Forma 2: universo reducido, contar solo el grupo que queda tras la condición (favorables ÷ total del grupo que queda). Siempre dan lo mismo; si la condición ocurre después en el tiempo conviene la Forma 1."],["Caminos mutuamente excluyentes","Cuando piden «uno y otro» sin orden (por ejemplo, una mujer y un hombre) se calcula cada camino posible como intersección y se suman, porque los caminos son mutuamente excluyentes y no se resta nada."],["Plantilla para intersecciones por pasos","1) Distinguir «dado que» de «ambas / y». 2) Partir el evento en pasos por orden cronológico (si no hay orden y hay varias maneras, identificar todos los caminos). 3) P(A) con el grupo completo. 4) P(B | A) con el grupo que queda. 5) Multiplicar; si hay varios caminos, sumarlos. 6) Opcional: comparar P(B | A) con P(B) y verificar con conteo."],["Errores comunes en probabilidad condicional","Creer que sin reemplazo no afecta el segundo saque; confundir excluyentes con independientes; decidir la independencia por intuición; invertir P(A | B) con P(B | A); buscar la intersección «comparando valores»; reutilizar una condicional en otro par; calcular P(B | A) con el grupo original; y olvidar un camino cuando no hay orden."]],"r":[{"t":"Probabilidad condicional","h":"<div class=\"regla\">P(A | B) = P(A ∩ B) / P(B), con P(B) &gt; 0</div>\n<p>Se lee: «la probabilidad de A dado que B ocurrió».</p>\n<p><b>Qué indica cada parte:</b></p>\n<ul>\n<li><b>A</b> (izquierda de la barra): el evento cuya probabilidad se quiere calcular.</li>\n<li><b>B</b> (derecha de la barra): la condición, lo que ya se sabe que ocurrió.</li>\n<li><b>P(A ∩ B)</b>: la probabilidad de que ocurran A y B a la vez.</li>\n<li><b>P(B)</b>: la probabilidad de la condición; se divide entre ella porque B es el nuevo universo.</li>\n</ul>"},{"t":"Universo reducido","h":"<p>Al saber que B ocurrió, el mundo de posibilidades se reduce a B: ese es el nuevo universo, y dentro de él se pregunta qué fracción cumple también A (los resultados de A ∩ B). Por eso se divide entre P(B).</p>"},{"t":"La condicional no es simétrica","h":"<p>P(A | B) casi nunca es igual a P(B | A): cambiar de lado de la barra cambia el universo. Ejemplo: P(mamífero | perro) = 1, pero P(perro | mamífero) es muy pequeña.</p>"},{"t":"Intersección A ∩ B","h":"<p>Que ocurran los dos eventos a la vez: son los resultados que pertenecen a A y a B al mismo tiempo. En un espacio equiprobable, P(A ∩ B) = casos favorables / casos posibles.</p>"},{"t":"Eventos mutuamente excluyentes","h":"<p>Eventos que no pueden ocurrir al mismo tiempo: A ∩ B = ∅, es decir P(A ∩ B) = 0. No son lo mismo que independientes: con probabilidad mayor que 0 son muy dependientes, porque si ocurre uno se sabe con certeza que el otro no.</p>"},{"t":"Fórmula de la unión","h":"<p>P(A ∪ B) = P(A) + P(B) − P(A ∩ B): se resta la intersección porque al sumar P(A) y P(B) esos resultados se contaron dos veces. Si son mutuamente excluyentes queda solo la suma.</p>"},{"t":"Regla del producto","h":"<p>P(A ∩ B) = P(A) · P(B | A), o también P(B) · P(A | B). Es la fórmula de la condicional despejada y funciona siempre, con eventos dependientes e independientes.</p>"},{"t":"Eventos independientes","h":"<p>Dos eventos son independientes cuando saber que uno ocurrió no cambia la probabilidad del otro. Hay tres formas equivalentes de comprobarlo:</p>\n<ul>\n<li><b>Por el producto:</b> P(A ∩ B) = P(A) · P(B)</li>\n<li><b>Condicionando a B:</b> P(A | B) = P(A), es decir, saber que B ocurrió no cambia la probabilidad de A</li>\n<li><b>Condicionando a A:</b> P(B | A) = P(B), es decir, saber que A ocurrió no cambia la probabilidad de B</li>\n</ul>\n<p>Son equivalentes: si una se cumple, se cumplen las otras dos; si una falla, fallan las tres.</p>\n<div class=\"nota\">Cuando hay duda se calcula, porque la intuición puede engañar.</div>"},{"t":"Eventos dependientes","h":"<p>Eventos en los que saber que uno ocurrió sí cambia la probabilidad del otro; su intersección se calcula con P(A) · P(B | A).</p>"},{"t":"Extracción sin reemplazo","h":"<p>La bola extraída no se devuelve, así que la urna cambia (menos bolas y otra proporción de colores) y el primer saque afecta al segundo: eventos dependientes, P(A) · P(B | A).</p>"},{"t":"Extracción con reemplazo","h":"<p>Se devuelve la bola, la urna siempre queda igual y los saques son independientes: P(A) · P(B).</p>"},{"t":"Independencia y complementos","h":"<p>Si A y B son independientes, también lo son A y B', A' y B, y A' y B'; por ejemplo P(A ∩ B') = P(A) · (1 − P(B)). Límite: no dice nada sobre A y otro evento D; para cada par nuevo hay que verificar de nuevo.</p>"},{"t":"Cinco caminos para obtener P(A ∩ B)","h":"<p>Según lo que dé el problema, P(A ∩ B) se obtiene así:</p>\n<ol>\n<li><b>Espacio muestral que se puede listar:</b> se cuentan los resultados que están en A y en B a la vez y se divide entre el total.<br>P(A ∩ B) = (resultados en A y B) / (resultados totales)</li>\n<li><b>Independientes:</b><br>P(A ∩ B) = P(A) · P(B)</li>\n<li><b>Dependientes:</b><br>P(A ∩ B) = P(A) · P(B | A)</li>\n<li><b>Si dan la unión:</b><br>P(A ∩ B) = P(A) + P(B) − P(A ∪ B)</li>\n<li><b>Mutuamente excluyentes:</b><br>P(A ∩ B) = 0</li>\n</ol>"},{"t":"Orden de trabajo con espacio muestral","h":"<ol>\n<li><b>Escribe</b> el espacio muestral completo.</li>\n<li><b>Lista</b> los resultados de cada evento y calcula P(A) y P(B).</li>\n<li><b>Busca</b> A ∩ B: son los resultados que aparecen en ambos eventos.</li>\n<li><b>Calcula</b> la condicional: P(A | B) = P(A ∩ B) / P(B).</li>\n<li><b>Verifica</b> la independencia comparando P(A ∩ B) con P(A) · P(B): si son iguales, A y B son independientes; si no, son dependientes.</li>\n</ol>\n<div class=\"nota\">Primero se cuenta, luego se verifica.</div>"},{"t":"Intersección vs. condicional en el enunciado","h":"<p><b>Condicional</b></p>\n<ul>\n<li>El enunciado dice «dado que», «sabiendo que» o «si...».</li>\n<li>Se resuelve en un solo paso: P(A | B) = P(A ∩ B) / P(B).</li>\n<li>No se multiplica por P(A).</li>\n</ul>\n<p><b>Intersección</b></p>\n<ul>\n<li>El enunciado dice «ambas», «las dos», «y» o «tanto... como...».</li>\n<li>Se resuelve en dos pasos: primero el universo reducido y luego el producto, P(A ∩ B) = P(A) · P(B | A).</li>\n</ul>"},{"t":"Dos formas de calcular una condicional","h":"<p><b>Forma 1: con la fórmula</b></p>\n<div class=\"regla\">P(A | B) = P(A ∩ B) / P(B)</div>\n<ul>\n<li><b>P(A ∩ B):</b> los resultados que cumplen A y B a la vez (se cuentan).</li>\n<li><b>P(B):</b> los resultados que cumplen la condición B.</li>\n</ul>\n<p><b>Forma 2: con el universo reducido</b></p>\n<div class=\"regla\">P(A | B) = (casos favorables de A dentro de B) / (total de casos de B)</div>\n<ul>\n<li>Se descarta todo lo que no cumple la condición B y se trabaja solo con el grupo que queda.</li>\n<li><b>Casos favorables:</b> los que cumplen A dentro de ese grupo.</li>\n<li><b>Total:</b> cuántos elementos tiene el grupo que queda.</li>\n</ul>\n<p>Las dos formas siempre dan lo mismo. Si la condición ocurre después en el tiempo, conviene la Forma 1.</p>"},{"t":"Caminos mutuamente excluyentes","h":"<p>Cuando piden «uno y otro» sin orden (por ejemplo, una mujer y un hombre) se calcula cada camino posible como intersección y se suman, porque los caminos son mutuamente excluyentes y no se resta nada.</p>"},{"t":"Plantilla para intersecciones por pasos","h":"<p><b>¿Cuándo el enunciado pide una intersección?</b> Cuando pide que ocurran varios eventos a la vez:</p>\n<ul>\n<li><b>«ambas», «las dos»:</b> ambas finalistas son mujeres; las dos bolas son rojas.</li>\n<li><b>«y», «tanto... como...»:</b> sale par y mayor que 3.</li>\n<li><b>«las tres», «todas»:</b> una secuencia de varios eventos, uno tras otro.</li>\n<li><b>«uno y otro» sin orden:</b> una mujer y un hombre (hay varios caminos).</li>\n</ul>\n<p>Si dice «dado que», «sabiendo que» o «si...», no es intersección: es una condicional.</p>\n<p><b>Pasos:</b></p>\n<ol>\n<li><b>Distinguir</b> «dado que» (condicional) de «ambas / y» (intersección).</li>\n<li><b>Partir el evento en pasos</b> por orden cronológico: A es lo que pasa primero y B lo que pasa después.</li>\n<li><b>Si no hay orden</b> y hay varias maneras de lograrlo, identificar todos los caminos (por ejemplo, mujer-hombre y hombre-mujer).</li>\n<li><b>P(A)</b> con el grupo completo.</li>\n<li><b>P(B | A)</b> con el grupo que queda después de A.</li>\n<li><b>Multiplicar:</b> P(A ∩ B) = P(A) · P(B | A). Si hay varios caminos, calcular cada uno y sumarlos.</li>\n<li><b>Opcional:</b> comparar P(B | A) con P(B) y verificar con conteo.</li>\n</ol>"},{"t":"Errores comunes en probabilidad condicional","h":"<p>Creer que sin reemplazo no afecta el segundo saque; confundir excluyentes con independientes; decidir la independencia por intuición; invertir P(A | B) con P(B | A); buscar la intersección «comparando valores»; reutilizar una condicional en otro par; calcular P(B | A) con el grupo original; y olvidar un camino cuando no hay orden.</p>"},{"t":"Ejemplo · Dado: par y 6","h":"<p>Se lanza un dado y se sabe que salió par (B). ¿Probabilidad de que sea 6 (A)?</p>\n<ol>\n<li><b>¿Qué piden?</b> «Se sabe que salió par» es una condición: es una condicional, no una intersección.</li>\n<li><b>¿Quién es A y quién es B?</b>\n<ul>\n<li>B = «sale par» = {2, 4, 6}: lo que ya se sabe (va después de la barra).</li>\n<li>A = «sale 6» = {6}: lo que se quiere calcular (va antes de la barra).</li>\n</ul></li>\n<li><b>Plantear:</b> P(A | B) = P(6 | par).</li>\n<li><b>Intersección:</b> se revisa cada cara; solo el 6 es 6 y par a la vez, así que A ∩ B = {6} y P(A ∩ B) = 1/6.</li>\n<li><b>P(B):</b> P(par) = 3/6.</li>\n<li><b>Forma 1 (fórmula):</b> P(6 | par) = P(6 ∩ par) / P(par) = (1/6) / (3/6) = <b>1/3</b>.</li>\n<li><b>Forma 2 (universo reducido):</b> si salió par solo quedan {2, 4, 6} y el 6 es 1 de las 3, así que <b>1/3</b>.</li>\n</ol>\n<div class=\"nota\"><b>Excluyentes o no:</b> «sale 3» y «sale par» tienen intersección vacía (excluyentes); «sale 6» y «sale par» tienen intersección {6} (no excluyentes).</div><div class=\"regla\">Respuesta: la probabilidad de que sea 6, sabiendo que salió par, es 1/3.</div>"},{"t":"Ejemplo · Urna con 5 azules y 7 grises","h":"<p>Una urna tiene 5 bolas azules y 7 grises (12 en total). Se sacan dos bolas, una tras otra, sin reemplazo. ¿Cuál es la probabilidad de que ambas sean azules?</p><p><b>Qué significa cada letra</b></p>\n<ul>\n<li><b>A1, A2:</b> el 1.º / 2.º saque es azul.</li>\n<li><b>G1:</b> el 1.º saque es gris.</li>\n<li><b>P(A2 | A1):</b> probabilidad de que el 2.º sea azul dado que el 1.º fue azul (la barra significa «dado que»).</li>\n<li><b>Intersección ∩:</b> significa «y». P(A1 ∩ A2) es la probabilidad de que el 1.º y el 2.º sean azules.</li>\n</ul>\n<p><b>Parte 1: ¿ambas azules? (urna con 5 azules y 7 grises, 12 bolas, sin reemplazo)</b></p>\n<ol>\n<li><b>Clasificar:</b> «ambas azules» es una intersección. Piden P(A1 ∩ A2).</li>\n<li><b>P(A1)</b> con el grupo completo: 5 azules de 12 bolas, P(A1) = 5/12.</li>\n<li><b>P(A2 | A1)</b> con el grupo que queda: se supone que A1 ya ocurrió (salió una azul y no se devuelve), así que quedan 11 bolas y 4 azules: P(A2 | A1) = 4/11.</li>\n<li><b>Multiplicar (regla del producto):</b> P(A1 ∩ A2) = P(A1) · P(A2 | A1) = (5/12)(4/11) = 20/132 = 5/33.</li>\n<li><b>Dependientes:</b> P(A2 | A1) = 4/11 ≠ 5/12 = P(A2), porque saber que el 1.º fue azul cambia la probabilidad del 2.º.</li>\n</ol>\n<div class=\"regla\">Respuesta: la probabilidad de que ambas bolas sean azules, sin reemplazo, es 5/33.</div>\n<p><b>Parte 2: ¿y si cambia el procedimiento?</b></p>\n<ol>\n<li><b>Si el 1.º hubiera sido gris (G1):</b> P(A2 | G1) = 5/11, porque quedan 5 azules entre 11 bolas; no 4/11. Eso es «el primero afecta al segundo».</li>\n<li><b>Con reemplazo:</b> se devuelve la bola y la urna no cambia, así que P(A2 | A1) = P(A2) = 5/12. Entonces P(A1 ∩ A2) = P(A1) · P(A2) = (5/12)(5/12) = 25/144.</li>\n<li><b>Regla rápida:</b> sin reemplazo → dependientes → P(A ∩ B) = P(A) · P(B | A); con reemplazo → independientes → P(A ∩ B) = P(A) · P(B).</li>\n<li><b>Ejemplo de la baraja:</b> dos ases sin reemplazo: P(AS1 ∩ AS2) = P(AS1) · P(AS2 | AS1) = (4/52)(3/51) = 1/221.</li>\n</ol>"},{"t":"Ejemplo · ¿Independientes? (dado)","h":"<p><b>Dependientes:</b> A = «sale 6», B = «sale par». P(A) = 1/6 pero P(A | B) = 1/3; como 1/6 ≠ 1/3, son dependientes.</p><p><b>Independientes aunque no sea obvio:</b> A = «sale par», B = «sale ≤ 4». P(A) = 1/2, P(B) = 4/6, P(A ∩ B) = P({2, 4}) = 2/6 = 1/3 y P(A) · P(B) = (1/2)(4/6) = 1/3: coinciden.</p><p><b>Sin condicional que usar:</b> A = impar {1,3,5}, B = mayor que 3 {4,5,6}: P(A ∩ B) = P({5}) = 1/6; P(A | B) = (1/6)/(3/6) = 1/3; P(A) · P(B) = 1/4 ≠ 1/6 → dependientes.</p><p>Atajos: con reemplazo → independientes; sin reemplazo → dependientes; monedas o dados distintos → independientes; pregunta clave: «¿saber lo que pasó en uno cambia lo que espero del otro?».</p>"},{"t":"Ejemplo · Tres eventos del dado (A impar, B mayor que 3, C múltiplo de 3)","h":"<p>Se lanza un dado justo. Sean A = «sale impar», B = «sale mayor que 3» y C = «sale múltiplo de 3». a) ¿Qué pares de estos eventos son independientes? b) Calcula P(A | C). c) Calcula P(A ∩ C'), donde C' es el complemento de C.</p><p><b>Qué significa cada letra</b> (se lanza un dado justo; 6 caras equiprobables, así que P(evento) = casos / 6):</p>\n<ul>\n<li><b>A</b> = «sale impar» = {1, 3, 5}.</li>\n<li><b>B</b> = «sale mayor que 3» = {4, 5, 6}.</li>\n<li><b>C</b> = «sale múltiplo de 3» = {3, 6}.</li>\n<li><b>C'</b> = el complemento de C, «no sale múltiplo de 3» = {1, 2, 4, 5}.</li>\n<li><b>P(A | C):</b> probabilidad de A dado que C ocurrió (la barra significa «dado que»).</li>\n<li><b>Intersección ∩:</b> significa «y». A ∩ B son los resultados que están en A y en B a la vez.</li>\n</ul>\n<p><b>Parte 1: ¿qué pares son independientes?</b> Criterio: dos eventos son independientes si la probabilidad de su intersección es igual al producto de sus probabilidades; por ejemplo, para A y B: P(A ∩ B) = P(A) · P(B).</p>\n<ol>\n<li><b>Probabilidades individuales:</b> P(A) = 3/6 = 1/2; P(B) = 3/6 = 1/2; P(C) = 2/6 = 1/3.</li>\n<li><b>A y B:</b> A ∩ B = {5}, así que P(A ∩ B) = 1/6. Por otro lado P(A) · P(B) = (1/2)(1/2) = 1/4. Como 1/6 ≠ 1/4, son <b>dependientes</b>.</li>\n<li><b>A y C:</b> A ∩ C = {3}, así que P(A ∩ C) = 1/6. P(A) · P(C) = (1/2)(1/3) = 1/6. Son iguales, así que son <b>independientes</b>.</li>\n<li><b>B y C:</b> B ∩ C = {6}, así que P(B ∩ C) = 1/6. P(B) · P(C) = (1/2)(1/3) = 1/6. Son iguales, así que son <b>independientes</b>.</li>\n</ol>\n<div class=\"nota\">Las intersecciones se encuentran contando los resultados; comparar valores solo sirve para decidir la independencia.</div>\n<div class=\"regla\">Respuesta: A y B son dependientes; A y C son independientes; B y C son independientes.</div>\n<p><b>Parte 2: una condicional y un complemento</b></p>\n<ol>\n<li><b>Condicional P(A | C):</b> P(A | C) = P(A ∩ C) / P(C) = (1/6)/(2/6) = 1/2. Coincide con P(A) = 1/2, como debe pasar con eventos independientes.</li>\n<li><b>Complemento de C:</b> P(C') = 4/6 = 2/3.</li>\n<li><b>Independencia con el complemento:</b> como A y C son independientes, también lo son A y C'. Entonces P(A ∩ C') = P(A) · P(C') = (1/2)(4/6) = 1/3.</li>\n<li><b>Comprobar contando:</b> A ∩ C' = {1, 3, 5} ∩ {1, 2, 4, 5} = {1, 5}, así que P(A ∩ C') = 2/6 = 1/3.</li>\n</ol>\n<div class=\"regla\">Respuesta: P(A | C) = 1/2 y P(A ∩ C') = 1/3.</div>"},{"t":"Ejercicio resuelto · Semifinalistas (7 hombres y 3 mujeres)","h":"<p>Un grupo de 10 semifinalistas para un trabajo consta de 7 hombres y 3 mujeres. Todos se consideran igualmente calificados, y los nombres de dos de ellos se sacan, uno tras otro, al azar, para convertirse en finalistas. a) ¿Cuál es la probabilidad de que ambas finalistas sean mujeres? c) ¿Cuál es la probabilidad de que un finalista sea una mujer y el otro sea un hombre?</p>\n<p><b>Notación</b> (hay 7 hombres y 3 mujeres, 10 personas):</p>\n<ul>\n<li><b>M1:</b> la 1.ª persona es mujer. <b>H1:</b> la 1.ª es hombre.</li>\n<li><b>M2:</b> la 2.ª persona es mujer. <b>H2:</b> la 2.ª es hombre.</li>\n<li>Cada camino es una intersección y se calcula con la regla del producto: P(1.º ∩ 2.º) = P(1.º) · P(2.º | 1.º).</li>\n</ul>\n<p><b>Todos los caminos posibles</b></p>\n<ol>\n<li><b>Mujer, Mujer:</b> P(M1 ∩ M2) = P(M1) · P(M2 | M1) = (3/10)(2/9) = 6/90.<br>P(M1) = 3/10: 3 mujeres de 10. P(M2 | M1) = 2/9: ya salió una mujer, quedan 2 mujeres de 9 personas.</li>\n<li><b>Mujer, Hombre:</b> P(M1 ∩ H2) = P(M1) · P(H2 | M1) = (3/10)(7/9) = 21/90.<br>P(H2 | M1) = 7/9: salió una mujer, siguen los 7 hombres entre 9 personas.</li>\n<li><b>Hombre, Mujer:</b> P(H1 ∩ M2) = P(H1) · P(M2 | H1) = (7/10)(3/9) = 21/90.<br>P(H1) = 7/10: 7 hombres de 10. P(M2 | H1) = 3/9: salió un hombre, siguen las 3 mujeres entre 9 personas.</li>\n<li><b>Hombre, Hombre:</b> P(H1 ∩ H2) = P(H1) · P(H2 | H1) = (7/10)(6/9) = 42/90.<br>P(H2 | H1) = 6/9: salió un hombre, quedan 6 hombres de 9 personas.</li>\n<li><b>Verificar:</b> 6/90 + 21/90 + 21/90 + 42/90 = 90/90 = 1. Los cuatro caminos cubren todo y son excluyentes entre sí.</li>\n</ol>\n<p><b>Inciso a) ¿Ambas son mujeres?</b></p>\n<ol>\n<li><b>Clasificar:</b> «ambas» es una intersección. Piden P(M1 ∩ M2).</li>\n<li><b>P(M1)</b> con el grupo completo: 3/10.</li>\n<li><b>P(M2 | M1)</b> con el grupo que queda: se supone que M1 ya ocurrió (salió una mujer y no se devuelve), así que quedan 9 personas y solo 2 mujeres: 2/9.</li>\n<li><b>Multiplicar:</b> P(M1 ∩ M2) = (3/10)(2/9) = 6/90 = 1/15 ≈ 0.067.</li>\n<li><b>Comprobar por conteo:</b> C(3,2)/C(10,2) = 3/45 = 1/15.</li>\n<li><b>Dependientes:</b> P(M2 | M1) = 2/9 ≠ 3/10 = P(M2), porque se elige del mismo grupo sin devolver.</li>\n</ol>\n<div class=\"regla\">Respuesta a): la probabilidad de que ambas finalistas sean mujeres es 1/15 ≈ 0.067.</div>\n<p><b>Inciso c) ¿Una mujer y el otro hombre?</b></p>\n<ol>\n<li><b>Clasificar:</b> «una mujer y el otro hombre», sin orden: hay dos caminos.</li>\n<li><b>Caminos:</b> M1 ∩ H2 (mujer, hombre) y H1 ∩ M2 (hombre, mujer). Son excluyentes entre sí.</li>\n<li><b>Sumar:</b> P(M1 ∩ H2) + P(H1 ∩ M2) = 21/90 + 21/90 = 42/90 = 7/15 ≈ 0.467.</li>\n<li><b>Comprobar por conteo:</b> 3 · 7 = 21 parejas de 45 → 21/45 = 7/15.</li>\n</ol>\n<div class=\"regla\">Respuesta c): la probabilidad de que una sea mujer y el otro hombre es 7/15 ≈ 0.467.</div>\n<p><b>Diferencia clave, con la Forma 1</b></p>\n<ul>\n<li><b>Condicional</b> «¿la 2.ª es mujer, dado que la 1.ª fue mujer?»: un solo paso, P(M2 | M1) = 2/9.</li>\n<li><b>Intersección</b> «¿ambas son mujeres?»: dos pasos, P(M1 ∩ M2) = 1/15.</li>\n<li><b>Forma 1 para confirmar el 2/9:</b> P(M2 | M1) = P(M1 ∩ M2) / P(M1). Hay 90 parejas ordenadas (10 · 9); con la 1.ª mujer hay 3 · 9 = 27; con ambas mujeres hay 3 · 2 = 6.</li>\n</ul>\n<div class=\"regla\">P(M2 | M1) = (6/90) / (27/90) = 6/27 = 2/9</div>"},{"t":"Ejemplo · Independencia por el mecanismo (urna con 2 rojas y 2 azules)","h":"<p>Una urna tiene 2 bolas rojas y 2 azules y se sacan 2 bolas, una tras otra. Sean A = «la 1.ª es roja» y B = «la 2.ª es roja». ¿Son independientes A y B si se saca a) sin reemplazo? b) con reemplazo?</p>\n<p><b>Cómo se construyen los casos</b> (urna con rojas R1, R2 y azules Z1, Z2; son 4 bolas):</p>\n<ol>\n<li><b>Parejas sin reemplazo:</b> 4 opciones para la 1.ª y 3 para la 2.ª: 4 · 3 = 12.</li>\n<li><b>Parejas con reemplazo:</b> 4 opciones para cada saque: 4 · 4 = 16.</li>\n<li><b>A (1.ª roja):</b> sin reemplazo 2 · 3 = 6 parejas; con reemplazo 2 · 4 = 8.</li>\n<li><b>B (2.ª roja):</b> sin reemplazo, 1.ª roja y 2.ª roja: 2 · 1 = 2; 1.ª azul y 2.ª roja: 2 · 2 = 4; total 6. Con reemplazo 4 · 2 = 8.</li>\n<li><b>A ∩ B (ambas rojas):</b> sin reemplazo 2 · 1 = 2 parejas, (R1,R2) y (R2,R1); con reemplazo 2 · 2 = 4, (R1,R1), (R1,R2), (R2,R1) y (R2,R2).</li>\n</ol>\n<table><tr><th></th><th>Sin reemplazo (12 parejas)</th><th>Con reemplazo (16 parejas)</th></tr><tr><td>P(A)</td><td>6/12 = 1/2</td><td>8/16 = 1/2</td></tr><tr><td>P(B)</td><td>6/12 = 1/2</td><td>8/16 = 1/2</td></tr><tr><td>P(A ∩ B) contando</td><td>2/12 = 1/6</td><td>4/16 = 1/4</td></tr><tr><td>P(A) · P(B)</td><td>1/4</td><td>1/4</td></tr><tr><td>Conclusión</td><td>1/6 ≠ 1/4 → dependientes</td><td>1/4 = 1/4 → independientes</td></tr></table>\n<ul>\n<li>Con solo P(A) = 0.5 y P(B) = 0.4 no se puede decidir: P(A ∩ B) podría ser 0.2, 0.1 o 0.3.</li>\n<li>Si P(A ∩ B) es justo lo que piden, no se usa la prueba (sería un círculo): se decide por el mecanismo del experimento.</li>\n</ul><div class=\"regla\">Respuesta: sin reemplazo, A y B son dependientes; con reemplazo, A y B son independientes.</div>"},{"t":"Mapa de decisión de probabilidad condicional","h":"<table><tr><th>Si el problema...</th><th>Entonces...</th><th>Fórmula</th></tr>\n<tr><td>Da el espacio muestral (puedes listar)</td><td>Cuenta A ∩ B, calcula la condicional y verifica la independencia</td><td>P(A ∩ B) = casos en A y B / casos totales<br>P(A | B) = P(A ∩ B) / P(B)<br>Independientes si P(A ∩ B) = P(A) · P(B)</td></tr>\n<tr><td>Dice «independientes» o «con reemplazo»</td><td>Multiplica las probabilidades</td><td>P(A ∩ B) = P(A) · P(B)</td></tr>\n<tr><td>Dice «sin reemplazo» o da P(B | A)</td><td>Multiplica usando la condicional</td><td>P(A ∩ B) = P(A) · P(B | A)</td></tr>\n<tr><td>Da la unión P(A ∪ B)</td><td>Despeja la intersección</td><td>P(A ∩ B) = P(A) + P(B) − P(A ∪ B)</td></tr>\n<tr><td>Dice «mutuamente excluyentes»</td><td>La intersección es vacía</td><td>P(A ∩ B) = 0</td></tr>\n<tr><td>Ya probaste que A y B son independientes</td><td>Sus complementos también lo son: usa el producto con A', B'</td><td>P(A ∩ B') = P(A) · P(B')<br>P(A' ∩ B) = P(A') · P(B)<br>P(A' ∩ B') = P(A') · P(B')</td></tr>\n<tr><td>Experimento por pasos y piden «ambas / las dos»</td><td>Parte en pasos A, B por orden; P(A) con el grupo completo, P(B | A) con el grupo que queda; multiplica</td><td>P(A ∩ B) = P(A) · P(B | A)</td></tr>\n<tr><td>Piden una condicional («dado que») en un experimento por pasos</td><td>Universo reducido: cuenta el grupo que queda tras la condición; no multiplicas por P(A)</td><td>P(B | A) = favorables de B en el grupo que queda / total del grupo que queda</td></tr>\n<tr><td>Piden «uno y otro» sin orden</td><td>Calcula cada camino como intersección y suma los caminos (excluyentes entre sí)</td><td>P(X1 ∩ Y2) + P(Y1 ∩ X2), con cada término = P(1.º) · P(2.º | 1.º)</td></tr></table>"}]},{"n":"Condicional vs. Bayes (y probabilidad total)","c":[["Teorema de Bayes","P(A | B) = P(B | A) · P(A) / P(B). No es una fórmula nueva: sale de usar la definición de condicional dos veces (P(A ∩ B) = P(B | A) · P(A)). Sirve para «darle la vuelta» a una condicional cuando dan P(B | A) y piden P(A | B)."],["Probabilidad total","Si las causas A1, ..., An son excluyentes y cubren todas las posibilidades: P(B) = P(B | A1)·P(A1) + ... + P(B | An)·P(An). B solo puede ocurrir «pasando por» alguna de las causas; es el denominador de Bayes."],["Partición de causas","Conjunto de causas A1, A2, ..., An que son excluyentes (no se traslapan) y cubren todas las posibilidades (no falta ninguna); es lo que permite aplicar la probabilidad total."],["Teorema de la multiplicación","P(A ∩ B) = P(A) · P(B | A). Para una secuencia: P(A1 ∩ A2 ∩ ... ∩ An) = P(A1) · P(A2 | A1) · P(A3 | A1 ∩ A2) · ... · P(An | A1 ∩ ... ∩ An−1). Es lo que se hace al recorrer una rama de un diagrama de árbol."],["Probabilidad a priori y a posteriori","A priori es la probabilidad de la causa antes de observar la evidencia; a posteriori es la que resulta después de observarla. Bayes corrige la creencia sobre la causa con la evidencia (por ejemplo, de 0.40 a 0.526)."],["Evidencia observada","Lo que el enunciado da como hecho («dado que», «sabiendo que», «resulta que», «se observa que», «sale defectuosa», «da positivo»). Va después de la barra."],["Causa (incógnita en Bayes)","Lo que se quiere averiguar y no se ve (la máquina, si la persona está enferma, la urna). Va antes de la barra: si ya se supiera la causa, no habría nada que calcular."],["Paso 0: ¿hay algo observado?","Antes de clasificar se busca si el enunciado da evidencia observada. Si no la hay, no es condicional directa ni Bayes: se usa la multiplicación (para cada camino o secuencia) y la probabilidad total (para sumar los caminos)."],["Cómo distinguir condicional directa de Bayes","Condicional directa: se pueden calcular P(A ∩ B) y P(B) directo (tabla, conteos, diagrama). Bayes: dan P(B | A) y piden P(A | B), los mismos eventos intercambiados (de la causa al efecto, y la pregunta del efecto a la causa)."],["Regla de desempate","1) ¿El enunciado da conteos o una tabla? → condicional directa. 2) ¿Da porcentajes o tasas por causa? → Bayes. 3) Si se duda, usar Bayes: es la misma condicional con la intersección reescrita, no falla; solo es más trabajo."],["Chequeo «hacia atrás»","Los datos vienen en el orden de la historia (causa → efecto). Si la pregunta pide ir hacia atrás (del efecto a la causa), es Bayes. Excepción: con conteos o una tabla manda la condicional directa aunque la pregunta vaya hacia atrás."],["Traducción de frases a notación","«Si se sabe que», «dado que», «de los que», «entre los que» → después de la barra; «se observa que», «da positivo» → evidencia, después de la barra; «¿probabilidad de que venga de...?» → incógnita, antes de la barra; «sea A y B» sin «dado que» → intersección P(A ∩ B)."],["Algoritmo de clasificación","Paso 0: ¿hay algo observado? Paso 1: traducir todo a notación con nombres descriptivos. Paso 2: comparar los datos con la pregunta (¿se puede calcular la intersección o están intercambiados?). Paso 3: si es Bayes, armar el denominador con probabilidad total. Paso 4: calcular y verificar (entre 0 y 1; las causas suman 1)."],["Verificación de Bayes","Si se calcula la probabilidad de todas las causas dada la evidencia, deben sumar 1; si no suman 1, hay un error en el denominador."],["Nombres descriptivos de eventos","Solución al error de usar A y B para dos cosas a la vez: ponerle nombres propios a los eventos del problema (MA, MB, D, +, Enfermo). Las letras A y B de la fórmula son solo moldes; lo que piden averiguar va antes de la barra."],["Pieza de Bayes: multiplicación y probabilidad total","El numerador de Bayes, P(B | Ai)·P(Ai), es la multiplicación y el denominador P(B) es la probabilidad total; por eso muchos ejercicios del capítulo de Bayes piden solo una de esas piezas (por ejemplo, calcular P(B))."],["Falsos positivos en una prueba diagnóstica","Aunque la prueba sea muy buena, si la condición es rara los falsos positivos de la gran mayoría sana superan a los verdaderos positivos; Bayes corrige la intuición de que positivo = enfermo (con 2% de prevalencia, 98% y 5%: P(C | +) = 2/7 ≈ 0.286)."],["Simetría de las posiciones sin reemplazo","Sin información de lo que salió antes, cualquier bola tiene la misma probabilidad de caer en cualquier posición (es como ordenar al azar): en una urna de 3 negras y 2 blancas, P(B1) = P(B2) = P(B3) = 2/5. Sirve como chequeo del resultado."],["Errores comunes en condicional vs. Bayes","1) Decir «piden la intersección» cuando piden la condicional. 2) Usar A y B para dos cosas a la vez. 3) Mezclar la causa con la evidencia dentro de «lo que ya pasó». 4) Justificar con «ya sucedió B» (pasa en ambos casos). 5) Creer que sin reemplazo hay independencia, o llamar Bayes a todo lo que tenga condicionales."]],"r":[{"t":"Teorema de Bayes","h":"<p>P(A | B) = P(B | A) · P(A) / P(B). No es una fórmula nueva: sale de usar la definición de condicional dos veces (P(A ∩ B) = P(B | A) · P(A)). Sirve para «darle la vuelta» a una condicional cuando dan P(B | A) y piden P(A | B).</p>"},{"t":"Probabilidad total","h":"<div class=\"regla\">P(B) = P(B | A1)·P(A1) + P(B | A2)·P(A2) + ... + P(B | An)·P(An)</div>\n<p>Se usa cuando las causas A1, ..., An son excluyentes (no pueden pasar a la vez) y cubren todas las posibilidades (sus probabilidades suman 1).</p>\n<p><b>La idea.</b> B solo puede ocurrir «pasando por» alguna de las causas. Cada causa aporta su parte: la probabilidad de la causa por la probabilidad de que esa causa produzca B. Se suman todas las partes. Es el denominador de Bayes.</p>\n<p><b>Cuándo es clave.</b> Cuando te piden la probabilidad de un evento B «a secas», sin condicionarlo a nada, y B puede ocurrir por varios caminos distintos.</p>\n<p><b>Señales en el enunciado:</b></p>\n<ul>\n<li>Piden P(B) sin «dado que» ni «sabiendo que»: «¿probabilidad de que una pieza sea defectuosa?», «¿de que la prueba dé positivo?», «¿de que la 2.ª bola sea blanca?».</li>\n<li>Hay causas que se excluyen entre sí y cubren todo: máquina 1, 2 o 3; enfermo o sano; urna 1, 2 o 3; la 1.ª bola fue blanca o negra.</li>\n<li>Te dan la probabilidad de cada causa, P(Ai), y la probabilidad del evento según cada causa, P(B | Ai); suelen venir como porcentajes por causa.</li>\n<li>El experimento va por etapas y lo que pasa en la primera cambia la segunda (por ejemplo, extracciones sin reemplazo).</li>\n</ul>\n<p><b>Cómo identificarla y aplicarla, paso a paso:</b></p>\n<ol>\n<li><b>¿Hay algo observado?</b> Si no hay «dado que» y piden P(B), es candidata a probabilidad total.</li>\n<li><b>Identifica B</b> (el efecto) y <b>las causas</b> A1, ..., An. Comprueba que son excluyentes y que cubren todo.</li>\n<li><b>Escribe los datos</b> de cada causa: P(Ai) y P(B | Ai).</li>\n<li><b>Multiplica en cada causa:</b> P(Ai) · P(B | Ai). Cada producto es un camino hacia B.</li>\n<li><b>Suma todos los caminos:</b> eso es P(B).</li>\n<li><b>Verifica:</b> el resultado está entre 0 y 1 y las probabilidades de las causas suman 1.</li>\n</ol>\n<p><b>Ejemplo.</b> Máquina A produce el 60% y la B el 40%; el 3% de A y el 5% de B salen defectuosas. «¿Probabilidad de que una pieza sea defectuosa?» es probabilidad total: P(D) = 0.03 · 0.60 + 0.05 · 0.40 = 0.018 + 0.020 = 0.038.</p>\n<p><b>Cómo se distingue de Bayes.</b> La probabilidad total va de las causas al efecto y da P(B). Bayes parte de que B ya se observó y pregunta por la causa, P(Ai | B); para eso usa la probabilidad total como denominador. Si en el ejemplo anterior preguntaran «si la pieza salió defectuosa, ¿de qué máquina viene?», ya sería Bayes.</p>\n<p><b>Cómo se relaciona con la multiplicación.</b> Cada camino se calcula con la regla del producto, P(Ai) · P(B | Ai). La probabilidad total es sumar esos caminos.</p>\n<p><b>Cuándo no hace falta.</b> Si el enunciado da conteos o una tabla con el total de B, P(B) se cuenta directo. Y si las causas que tienes no cubren todo, falta un camino: agrégalo (por ejemplo, «ninguna de las anteriores») o el resultado quedará incompleto.</p>\n<div class=\"nota\"><b>Pregunta para recordarlo:</b> ¿B puede pasar por varios caminos y me piden su probabilidad completa? Entonces calculo cada camino y los sumo.</div>"},{"t":"Partición de causas","h":"<p>Conjunto de causas A1, A2, ..., An que son excluyentes (no se traslapan) y cubren todas las posibilidades (no falta ninguna); es lo que permite aplicar la probabilidad total.</p>"},{"t":"Teorema de la multiplicación","h":"<p><b>Idea 1: dos eventos</b></p>\n<div class=\"regla\">P(A ∩ B) = P(A) · P(B | A)</div>\n<ul>\n<li><b>P(A ∩ B):</b> probabilidad de que ocurran A y B (A «y» B).</li>\n<li><b>P(A):</b> probabilidad de que ocurra A primero, calculada con el grupo completo.</li>\n<li><b>P(B | A):</b> probabilidad de que ocurra B suponiendo que A ya ocurrió, calculada con el grupo que queda.</li>\n</ul>\n<p>En palabras: para que ocurran A y B, primero ocurre A y luego, suponiendo que A ocurrió, ocurre B. La fórmula sale de la definición de condicional, P(B | A) = P(A ∩ B) / P(A), al multiplicar ambos lados por P(A).</p>\n<p><b>Ejemplo:</b> dos ases seguidos sin reemplazo. P(A1 ∩ A2) = P(A1) · P(A2 | A1) = (4/52)(3/51) = 1/221.</p>\n<p><b>Idea 2: una secuencia de varios eventos</b></p>\n<div class=\"regla\">P(A1 ∩ A2 ∩ ... ∩ An) = P(A1) · P(A2 | A1) · P(A3 | A1 ∩ A2) · ... · P(An | A1 ∩ ... ∩ An−1)</div>\n<ul>\n<li>El primer factor, P(A1), se calcula con el grupo completo.</li>\n<li>Cada factor siguiente se calcula suponiendo que ya ocurrieron todos los anteriores: después de la barra va cada vez un evento más.</li>\n<li>Se multiplican todos los factores.</li>\n</ul>\n<p>Se obtiene aplicando la fórmula de dos eventos una y otra vez. Es lo que se hace al recorrer una rama de un diagrama de árbol: cada tramo de la rama es un factor y se multiplican a lo largo de la rama.</p>\n<p><b>Ejemplo:</b> urna con 3 negras y 2 blancas, sin reemplazo. La rama «negra, negra, blanca» es P(N1 ∩ N2 ∩ B3) = P(N1) · P(N2 | N1) · P(B3 | N1 ∩ N2) = (3/5)(2/4)(2/3) = 1/5.</p>\n<p><b>Cuándo usarla:</b> cuando piden una intersección («ambas», «las dos», «y luego») en un experimento por pasos, o cuando te dan P(B | A). Si el resultado puede darse por varias ramas, se calcula cada rama con este teorema y luego se suman (probabilidad total).</p>"},{"t":"Probabilidad a priori y a posteriori","h":"<p>A priori es la probabilidad de la causa antes de observar la evidencia; a posteriori es la que resulta después de observarla. Bayes corrige la creencia sobre la causa con la evidencia (por ejemplo, de 0.40 a 0.526).</p>"},{"t":"Evidencia observada","h":"<p>Lo que el enunciado da como hecho («dado que», «sabiendo que», «resulta que», «se observa que», «sale defectuosa», «da positivo»). Va después de la barra.</p>"},{"t":"Causa (incógnita en Bayes)","h":"<p>Lo que se quiere averiguar y no se ve (la máquina, si la persona está enferma, la urna). Va antes de la barra: si ya se supiera la causa, no habría nada que calcular.</p>"},{"t":"Paso 0: ¿hay algo observado?","h":"<p>Antes de clasificar se busca si el enunciado da evidencia observada. Si no la hay, no es condicional directa ni Bayes: se usa la multiplicación (para cada camino o secuencia) y la probabilidad total (para sumar los caminos).</p>"},{"t":"Cómo distinguir condicional directa de Bayes","h":"<p><b>Condicional directa</b></p>\n<ul>\n<li>Se pueden calcular P(A ∩ B) y P(B) directamente (tabla, conteos, diagrama).</li>\n<li>Se aplica P(A | B) = P(A ∩ B) / P(B).</li>\n</ul>\n<p><b>Bayes</b></p>\n<ul>\n<li>Dan P(B | A) y piden P(A | B): los mismos eventos, intercambiados.</li>\n<li>Los datos van de la causa al efecto; la pregunta va del efecto a la causa.</li>\n<li>Se aplica P(A | B) = P(B | A) · P(A) / P(B).</li>\n</ul>"},{"t":"Regla de desempate","h":"<p>Orden para decidir entre condicional directa y Bayes sin depender de la intuición:</p>\n<ol>\n<li><b>¿El enunciado da conteos o una tabla?</b><br>Entonces es condicional directa: cuentas y divides.<br>P(A | B) = P(A ∩ B) / P(B)</li>\n<li><b>¿Da porcentajes o tasas por causa?</b> (por ejemplo, «el 3% de la máquina A» o «el 95% de los enfermos»)<br>Entonces es Bayes.<br>P(A | B) = P(B | A) · P(A) / P(B)</li>\n<li><b>Si dudas, usa Bayes.</b><br>Es la misma condicional con la intersección reescrita, así que no falla; solo es más trabajo. En un problema de conteos da el mismo resultado.</li>\n</ol>\n<p><b>Por qué funciona.</b> Con conteos, la intersección está a la vista y no hace falta reconstruirla. Con tasas por causa no la tienes y la armas con P(B | A) · P(A).</p>\n<p>Los dos caminos son la misma definición de condicional, así que elegir el más largo por seguridad nunca da una respuesta distinta.</p>"},{"t":"Chequeo «hacia atrás»","h":"<p>Los datos vienen en el orden de la historia (causa → efecto). Si la pregunta pide ir hacia atrás (del efecto a la causa), es Bayes. Excepción: con conteos o una tabla manda la condicional directa aunque la pregunta vaya hacia atrás.</p>"},{"t":"Traducción de frases a notación","h":"<table><tr><th>Frase del enunciado</th><th>Qué indica</th><th>Notación</th></tr>\n<tr><td>«Si se sabe que», «dado que», «de los que», «entre los que»</td><td>Lo que ya se sabe</td><td>Después de la barra: P( ... | B)</td></tr>\n<tr><td>«Se observa que», «da positivo»</td><td>Evidencia</td><td>Después de la barra: P( ... | +)</td></tr>\n<tr><td>«¿Probabilidad de que venga de...?»</td><td>Incógnita (la causa)</td><td>Antes de la barra: P(causa | ...)</td></tr>\n<tr><td>«Sea A y B» sin «dado que»</td><td>Intersección</td><td>P(A ∩ B)</td></tr></table>"},{"t":"Algoritmo de clasificación","h":"<ol start=\"0\">\n<li><b>¿Hay algo observado?</b></li>\n<li><b>Traducir</b> todo a notación con nombres descriptivos.</li>\n<li><b>Comparar los datos con la pregunta:</b> ¿se puede calcular la intersección o están intercambiados?</li>\n<li><b>Si es Bayes,</b> armar el denominador con probabilidad total.</li>\n<li><b>Calcular y verificar:</b> el resultado está entre 0 y 1 y las causas suman 1.</li>\n</ol>"},{"t":"Verificación de Bayes","h":"<p>Si se calcula la probabilidad de todas las causas dada la evidencia, deben sumar 1; si no suman 1, hay un error en el denominador.</p>"},{"t":"Nombres descriptivos de eventos","h":"<p>Solución al error de usar A y B para dos cosas a la vez: ponerle nombres propios a los eventos del problema (MA, MB, D, +, Enfermo). Las letras A y B de la fórmula son solo moldes; lo que piden averiguar va antes de la barra.</p>"},{"t":"Pieza de Bayes: multiplicación y probabilidad total","h":"<p>El numerador de Bayes, P(B | Ai)·P(Ai), es la multiplicación y el denominador P(B) es la probabilidad total; por eso muchos ejercicios del capítulo de Bayes piden solo una de esas piezas (por ejemplo, calcular P(B)).</p>"},{"t":"
