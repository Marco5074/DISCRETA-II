Falsos positivos en una prueba diagnóstica","h":"<p>Aunque la prueba sea muy buena, si la condición es rara los falsos positivos de la gran mayoría sana superan a los verdaderos positivos; Bayes corrige la intuición de que positivo = enfermo (con 2% de prevalencia, 98% y 5%: P(C | +) = 2/7 ≈ 0.286).</p>"},{"t":"Simetría de las posiciones sin reemplazo","h":"<p>Sin información de lo que salió antes, cualquier bola tiene la misma probabilidad de caer en cualquier posición (es como ordenar al azar): en una urna de 3 negras y 2 blancas, P(B1) = P(B2) = P(B3) = 2/5. Sirve como chequeo del resultado.</p>"},{"t":"Errores comunes en condicional vs. Bayes","h":"<ol>\n<li><b>Decir «piden la intersección» cuando piden la condicional.</b><br>Con «dado que» o equivalentes es una condicional, por ejemplo P(M | F). La intersección P(M ∩ F) es solo un ingrediente del numerador.<br>Sin «dado que» y con un «y», sí es una intersección.</li>\n<li><b>Usar A y B para dos cosas a la vez.</b><br>El problema habla de la máquina A y la máquina B, y la fórmula también usa los eventos A y B, y se mezclan.<br>Ponle nombres descriptivos a los eventos del problema: MA, MB, D. Las letras A y B de la fórmula son solo moldes.</li>\n<li><b>Mezclar la causa con la evidencia dentro de «lo que ya pasó».</b><br>La evidencia (D, la pieza es defectuosa) es lo observado y va después de la barra. La causa buscada (MB, viene de la máquina B) es la incógnita y va antes de la barra.</li>\n<li><b>Justificar con «ya sucedió B».</b><br>En todos los problemas de condicional y de Bayes ya sucedió algo, así que esa razón no distingue entre los dos.<br>Lo que distingue es la forma de los datos: conteos o tabla es condicional directa; tasas por causa con la pregunta invertida es Bayes.</li>\n<li><b>Creer que sin reemplazo hay independencia.</b><br>Sin reemplazo, cada extracción cambia la urna, así que los eventos son dependientes: P(B2 | B1) ≠ P(B2).</li>\n<li><b>Llamar «Bayes» a todo lo que tenga condicionales.</b><br>Las condicionales aparecen también en la multiplicación y en la probabilidad total. Bayes requiere evidencia observada y una causa por averiguar.</li>\n</ol>"},{"t":"Cómo se relacionan las piezas","h":"<table><tr><th>Herramienta</th><th>Qué responde</th><th>Fórmula</th><th>Cuándo aparece</th></tr><tr><td>Condicional</td><td>Probabilidad de A sabiendo que B ocurrió</td><td>P(A ∩ B) / P(B)</td><td>Hay «dado que» y se puede contar o calcular la intersección</td></tr><tr><td>Multiplicación</td><td>Probabilidad de una secuencia de eventos</td><td>P(A) · P(B | A)</td><td>Piden «A y luego B», o se recorre un camino de un árbol</td></tr><tr><td>Probabilidad total</td><td>Probabilidad de un evento que puede ocurrir por varios caminos</td><td>Σ P(B | Ai) · P(Ai)</td><td>Piden P(B) sin condicionarlo y B tiene varias causas</td></tr><tr><td>Bayes</td><td>Probabilidad de la causa, dada la evidencia</td><td>P(B | Ai) · P(Ai) / P(B)</td><td>Hay evidencia observada y piden ir hacia atrás, a la causa</td></tr><tr><td>Independencia</td><td>Comprueba si saber B cambia la probabilidad de A</td><td>P(A | B) = P(A)</td><td>Sirve para simplificar productos o descartar que dos eventos se afecten</td></tr></table><p>Regla de oro: lo que piden averiguar va antes de la barra; lo que ya se sabe que pasó (lo observado) va después. Si lo que dan es lo mismo que piden pero con los eventos intercambiados, es Bayes; si se puede sacar la intersección y P(B) directo, es condicional directa.</p>"},{"t":"Plantilla · Paso a paso general (empieza aquí)","h":"<p>Sigue siempre este orden: primero lee el enunciado, luego identifica el tipo de problema y, una vez identificado, ve a la página de su subcaso.</p><ol><li><b>Leer y subrayar.</b> Qué te dan (los datos) y qué te piden (la pregunta). Marca palabras como «dado que», «sabiendo que», «ambas», «y», «sin reemplazo».</li><li><b>Nombrar los eventos</b> con letras descriptivas (M, F, MA, D, +, A1, A2...). En la plantilla, A y B son moldes. Si el problema ya usa esas letras para otra cosa (máquina A, máquina B), pon las letras de tus eventos (MA, MB, D).</li><li><b>Traducir a notación.</b> Escribe cada dato y la pregunta como P(A | B). Lo que piden va antes de la barra; lo que ya se sabe, después.</li><li><b>Identificar el tipo.</b> Usa la página siguiente (detector): ¿hay algo observado?, ¿hay conteos o tasas por causa?, ¿piden «ambas»?, ¿varios caminos?</li><li><b>Resolver con la plantilla del subcaso</b> que corresponda (Subcasos 1 al 8).</li><li><b>Verificar y redactar la respuesta</b> (última página de la plantilla).</li></ol><div class=\"nota\">Las dos preguntas que más pesan: <b>¿hay algo observado?</b> y <b>¿qué forma tienen los datos: conteos, tasas por causa o pasos?</b></div>"},{"t":"Plantilla · Detector del tipo de problema","h":"<p>Lee el enunciado y busca qué aparece. Cada fila te manda a la página de su subcaso.</p><table><tr><th>Si en el enunciado ves...</th><th>Es...</th><th>Fórmula base</th><th>Ve a</th></tr>\n<tr><td>«dado que» / «si se elige a alguien que...» y conteos, tabla o espacio muestral</td><td>Condicional directa</td><td>P(A ∩ B) / P(B)</td><td>Subcaso 1</td></tr>\n<tr><td>Extracciones una tras otra, «sabiendo que la 1.ª fue...» y la pregunta va en el mismo sentido de la historia</td><td>Condicional directa en pasos</td><td>favorables / total del grupo que queda</td><td>Subcaso 2</td></tr>\n<tr><td>Tasas por causa, la pregunta va del efecto a la causa; 2 causas</td><td>Bayes</td><td>P(B | Ai) · P(Ai) / P(B)</td><td>Subcaso 3</td></tr>\n<tr><td>Lo mismo, con 3 o más causas</td><td>Bayes con varias causas</td><td>P(B) suma n términos</td><td>Subcaso 4</td></tr>\n<tr><td>«ambas», «las dos», «y», «las tres», sin «dado que»</td><td>Intersección / secuencia</td><td>P(A) · P(B | A)</td><td>Subcaso 5</td></tr>\n<tr><td>«una... y otra...» sin orden, o P(B) a secas que puede pasar por varios caminos</td><td>Sumar caminos (probabilidad total)</td><td>Σ P(Ai) · P(B | Ai)</td><td>Subcaso 6</td></tr>\n<tr><td>Experimento por pasos con evidencia en un paso posterior y piden algo anterior</td><td>Bayes por pasos</td><td>P(A ∩ B) / P(B), con caminos</td><td>Subcaso 7</td></tr>\n<tr><td>«¿son independientes?», «¿el primero afecta al segundo?»</td><td>Independencia</td><td>P(A ∩ B) vs. P(A) · P(B)</td><td>Subcaso 8</td></tr></table><div class=\"nota\">Si dudas entre condicional directa y Bayes: con conteos o tabla, condicional directa; con tasas por causa, Bayes. Si aún dudas, usa Bayes: no falla.</div>"},{"t":"Subcaso 1 · Condicional directa con conteos, tabla o espacio muestral","h":"<p><b>Señales en el enunciado</b></p><ul><li>Dan conteos, una tabla o un espacio muestral que se puede listar.</li><li>Hay «dado que», «si se elige a alguien que...» o «se sabe que».</li><li>Aunque la pregunta vaya «hacia atrás» (del ascenso al tipo de trabajo), con conteos manda la condicional directa.</li></ul><p><b>Plantilla</b></p><ol><li><b>Nombra</b> A (lo que piden) y B (la condición).</li><li><b>Escribe</b> lo que piden: P(A | B).</li><li><b>P(A ∩ B):</b> casos que cumplen A y B a la vez, entre el total.</li><li><b>P(B):</b> casos que cumplen B, entre el total.</li><li><b>Divide:</b> P(A | B) = P(A ∩ B) / P(B).</li><li><b>Comprueba con el universo reducido:</b> casos de A dentro de B entre casos de B (el total se cancela).</li></ol><div class=\"regla\">P(A | B) = P(A ∩ B) / P(B)</div><p><b>Cómo redactar la respuesta:</b> «La probabilidad de que [lo que piden], sabiendo que [lo observado], es [valor] ≈ [decimal]». Si no hay evidencia, omite «sabiendo que».</p><p><b>Ejemplos en esta guía:</b> Ejercicios 1, 3 y 7.</p><div class=\"nota\"><b>Cuidado:</b> la intersección es solo el numerador; lo que piden es la condicional. Con las intersecciones se encuentran contando, no comparando valores.</div>"},{"t":"Subcaso 2 · Condicional directa en un experimento por pasos","h":"<p><b>Señales en el enunciado</b></p><ul><li>Extracciones una tras otra (cartas, bolas) y «sabiendo que la 1.ª fue...».</li><li>La pregunta va en el mismo sentido de la historia: primero la 1.ª, luego la 2.ª.</li><li>No hay causa que buscar ni nada que invertir.</li></ul><p><b>Plantilla</b></p><ol><li><b>Nombra</b> Ai = la extracción i es [lo que sea]; por ejemplo A1 y A2.</li><li><b>Escribe</b> lo que piden: P(A2 | A1).</li><li><b>Grupo que queda:</b> quita lo que ya salió. Sin reemplazo el grupo cambia; con reemplazo no.</li><li><b>Cuenta:</b> favorables en el grupo que queda entre el total del grupo que queda.</li><li><b>Comprueba con la fórmula:</b> P(A1 ∩ A2) / P(A1).</li></ol><div class=\"regla\">P(A2 | A1) = favorables / total del grupo que queda</div><p><b>Cómo redactar la respuesta:</b> «La probabilidad de que [lo que piden], sabiendo que [lo observado], es [valor] ≈ [decimal]». Si no hay evidencia, omite «sabiendo que».</p><p><b>Ejemplos en esta guía:</b> Ejercicio 5.</p><div class=\"nota\"><b>Cuidado:</b> no multipliques por P(A1): la condicional termina en un solo paso. Multiplicar es para la intersección.</div>"},{"t":"Subcaso 3 · Bayes con dos causas","h":"<p><b>Señales en el enunciado</b></p><ul><li>Dan tasas por causa: P(evidencia | causa), como «el 3% de las piezas de A salen defectuosas».</li><li>Piden P(causa | evidencia): los mismos eventos, intercambiados (del efecto a la causa).</li><li>Hay dos causas excluyentes que cubren todo (máquina A o B, enfermo o sano, legítimo o spam).</li></ul><p><b>Plantilla</b></p><ol><li><b>Nombra</b> las causas A1 y A2 (con nombres descriptivos, como MA y MB) y la evidencia B (como D).</li><li><b>Datos:</b> P(A1), P(A2), P(B | A1) y P(B | A2). Si falta una causa, P(A2) = 1 − P(A1).</li><li><b>Escribe</b> lo que piden: P(Ai | B), con la causa buscada antes de la barra.</li><li><b>Numerador:</b> P(Ai ∩ B) = P(Ai) · P(B | Ai).</li><li><b>Otro camino a la evidencia:</b> P(Aj ∩ B) = P(Aj) · P(B | Aj).</li><li><b>Denominador (probabilidad total):</b> P(B) = suma de los dos caminos.</li><li><b>Divide:</b> P(Ai | B) = numerador / P(B).</li><li><b>Verifica:</b> P(A1 | B) + P(A2 | B) = 1.</li><li><b>Interpreta:</b> pasó de P(Ai) (a priori) a P(Ai | B) (a posteriori).</li></ol><div class=\"regla\">P(Ai | B) = P(B | Ai) · P(Ai) / [P(B | A1) · P(A1) + P(B | A2) · P(A2)]</div><p><b>Cómo redactar la respuesta:</b> «La probabilidad de que [lo que piden], sabiendo que [lo observado], es [valor] ≈ [decimal]». Si no hay evidencia, omite «sabiendo que».</p><p><b>Ejemplos en esta guía:</b> Ejercicios 2, 4 y 6.</p><div class=\"nota\"><b>Cuidado:</b> la causa que buscan puede ser la menos «obvia» (en el spam, «legítimo»). La evidencia siempre va después de la barra.</div>"},{"t":"Subcaso 4 · Bayes con tres o más causas","h":"<p><b>Señales en el enunciado</b></p><ul><li>Igual que el Subcaso 3, pero hay 3 o más causas (urna 1, 2 y 3; máquinas 1, 2 y 3).</li><li>Suelen elegir la causa «al azar», así que cada una vale 1/n.</li></ul><p><b>Plantilla</b></p><ol><li><b>Nombra</b> las causas A1, ..., An (con nombres descriptivos) y la evidencia B.</li><li><b>Probabilidad de cada causa:</b> P(Ai); si se elige al azar entre n, vale 1/n.</li><li><b>P(B | Ai)</b> para cada causa (por ejemplo, rojas entre total de bolas de esa urna).</li><li><b>Numerador de cada causa:</b> P(Ai) · P(B | Ai).</li><li><b>Denominador:</b> P(B) = suma de los n numeradores.</li><li><b>Divide</b> el numerador de la causa que piden entre P(B).</li><li><b>Verifica:</b> las posteriores de todas las causas suman 1.</li></ol><div class=\"regla\">P(Ai | B) = P(B | Ai) · P(Ai) / Σ P(B | Aj) · P(Aj)</div><p><b>Cómo redactar la respuesta:</b> «La probabilidad de que [lo que piden], sabiendo que [lo observado], es [valor] ≈ [decimal]». Si no hay evidencia, omite «sabiendo que».</p><p><b>Ejemplos en esta guía:</b> Ejercicio 8.</p><div class=\"nota\"><b>Cuidado:</b> usa un denominador común para sumar las fracciones; el denominador suma tantos términos como causas haya.</div>"},{"t":"Subcaso 5 · Intersección o secuencia (sin evidencia observada)","h":"<p><b>Señales en el enunciado</b></p><ul><li>Dicen «ambas», «las dos», «y», «tanto... como...», «las tres».</li><li>No hay «dado que»: no te dicen qué pasó, piden que pasen varias cosas.</li><li>Es un experimento por pasos (sorteos, extracciones).</li></ul><p><b>Plantilla</b></p><ol><li><b>Nombra los pasos en orden cronológico:</b> A = lo que pasa primero, B = lo que pasa después.</li><li><b>Escribe</b> lo que piden: P(A ∩ B).</li><li><b>P(A)</b> con el grupo completo.</li><li><b>P(B | A)</b> con el grupo que queda: se supone que A ya ocurrió.</li><li><b>Multiplica:</b> P(A ∩ B) = P(A) · P(B | A). Con más pasos, sigue el producto.</li><li><b>Comprueba con conteo</b> (casos favorables entre casos posibles, con combinaciones).</li><li><b>Dependencia:</b> compara P(B | A) con P(B); sin reemplazo son distintas.</li></ol><div class=\"regla\">P(A ∩ B) = P(A) · P(B | A)</div><p><b>Cómo redactar la respuesta:</b> «La probabilidad de que [lo que piden], sabiendo que [lo observado], es [valor] ≈ [decimal]». Si no hay evidencia, omite «sabiendo que».</p><p><b>Ejemplos en esta guía:</b> Semifinalistas (inciso a) y urna azul/gris.</p><div class=\"nota\"><b>Cuidado:</b> no es una condicional: la condicional termina en un paso y la intersección lleva dos pasos. P(B | A) no es un dato del enunciado, es el segundo paso del camino.</div>"},{"t":"Subcaso 6 · Varios caminos (sumar caminos / probabilidad total)","h":"<p><b>Señales en el enunciado</b></p><ul><li>«Una mujer y un hombre» sin orden, o «la 2.ª sea blanca» sin saber qué salió antes.</li><li>Piden P(B) a secas y B puede ocurrir por varias causas o ramas.</li><li>No hay evidencia observada.</li></ul><p><b>Plantilla</b></p><ol><li><b>Lista todos los caminos</b> (las ramas del árbol) que llevan a lo que piden.</li><li><b>Cada camino es una intersección:</b> el producto de sus tramos.</li><li><b>Comprueba que los caminos son excluyentes</b> entre sí.</li><li><b>Suma los caminos.</b></li><li><b>Verifica:</b> todos los caminos del árbol suman 1, y comprueba con conteo si se puede.</li></ol><div class=\"regla\">P(B) = P(A1) · P(B | A1) + P(A2) · P(B | A2) + ...</div><p><b>Cómo redactar la respuesta:</b> «La probabilidad de que [lo que piden], sabiendo que [lo observado], es [valor] ≈ [decimal]». Si no hay evidencia, omite «sabiendo que».</p><p><b>Ejemplos en esta guía:</b> Ejercicio 9 (2.ª y 3.ª bola), semifinalistas (inciso c) y P(defectuosa) de las dos máquinas.</p><div class=\"nota\"><b>Cuidado:</b> olvidar un camino. En «una mujer y un hombre» son dos: mujer-hombre y hombre-mujer.</div>"},{"t":"Subcaso 7 · Bayes dentro de un experimento por pasos","h":"<p><b>Señales en el enunciado</b></p><ul><li>Experimento por pasos (sin reemplazo) con evidencia en un paso posterior y piden algo de un paso anterior.</li><li>Ejemplo: «si la 3.ª salió blanca, ¿probabilidad de que la 1.ª haya sido negra?».</li><li>La condición ocurre después en el tiempo.</li></ul><p><b>Plantilla</b></p><ol><li><b>Nombra</b> la evidencia (B3) y la incógnita (N1). Piden P(N1 | B3).</li><li><b>Usa la Forma 1</b> (con la intersección): el universo reducido se vuelve incómodo cuando la condición ocurre después.</li><li><b>Numerador:</b> suma los caminos que cumplen la incógnita y la evidencia, cada uno por multiplicación.</li><li><b>Denominador:</b> P(B3) = suma de todos los caminos con la evidencia (probabilidad total).</li><li><b>Divide:</b> P(N1 | B3) = P(N1 ∩ B3) / P(B3).</li><li><b>Verifica:</b> P(N1 | B3) + P(B1 | B3) = 1.</li></ol><div class=\"regla\">P(N1 | B3) = P(N1 ∩ B3) / P(B3)</div><p><b>Cómo redactar la respuesta:</b> «La probabilidad de que [lo que piden], sabiendo que [lo observado], es [valor] ≈ [decimal]». Si no hay evidencia, omite «sabiendo que».</p><p><b>Ejemplos en esta guía:</b> Variante del Ejercicio 9: (1/5 + 1/10) / (2/5) = 3/4.</p><div class=\"nota\"><b>Cuidado:</b> el denominador es el mismo P(B3) que calculaste con probabilidad total; Bayes reutiliza la multiplicación y la probabilidad total.</div>"},{"t":"Subcaso 8 · ¿Son independientes?","h":"<p><b>Señales en el enunciado</b></p><ul><li>Preguntan «¿son independientes?» o «¿el primero afecta al segundo?».</li><li>Quieren que decidas si saber un evento cambia la probabilidad del otro.</li></ul><p><b>Plantilla</b></p><ol><li><b>Mira qué datos tienes:</b> solo P(A) y P(B) → no se puede decidir; tienes P(A ∩ B), una condicional, una tabla o el espacio muestral → prueba numérica; solo la descripción del experimento → mecanismo.</li><li><b>Prueba numérica:</b> halla P(A ∩ B) contando y compara con P(A) · P(B).</li><li><b>Concluye:</b> si son iguales, independientes; si no, dependientes (equivale a P(A | B) = P(A)).</li><li><b>Por mecanismo:</b> con reemplazo son independientes; sin reemplazo, dependientes.</li><li><b>Si P(A ∩ B) es lo que piden,</b> no uses la prueba (sería un círculo): decide por el mecanismo.</li><li><b>Si ya son independientes,</b> sus complementos también lo son (A y B', A' y B, A' y B').</li></ol><div class=\"regla\">Independientes ⇔ P(A ∩ B) = P(A) · P(B) ⇔ P(A | B) = P(A)</div><p><b>Cómo redactar la respuesta:</b> «La probabilidad de que [lo que piden], sabiendo que [lo observado], es [valor] ≈ [decimal]». Si no hay evidencia, omite «sabiendo que».</p><p><b>Ejemplos en esta guía:</b> Tres eventos del dado y urna con 2 rojas y 2 azules (probabilidad condicional).</p><div class=\"nota\"><b>Cuidado:</b> no confundas excluyentes con independientes: dos eventos excluyentes con probabilidad mayor que 0 son muy dependientes.</div>"},{"t":"Plantilla · Cierre: verificar y redactar la respuesta","h":"<p>Antes de dar el ejercicio por terminado, revisa esta lista.</p><ol><li><b>¿Respondí lo que preguntan?</b> Escribe la respuesta en palabras: «La probabilidad de que [lo que piden], sabiendo que [lo observado], es [fracción] ≈ [decimal]».</li><li><b>¿El resultado está entre 0 y 1?</b> Si no, hay un error.</li><li><b>Si fue Bayes:</b> ¿las probabilidades de todas las causas dado la evidencia suman 1?</li><li><b>Si hubo varios caminos:</b> ¿incluí todos? ¿Suman 1 los del árbol completo?</li><li><b>¿Comprobé con otro método?</b> Por ejemplo, conteo, universo reducido o la Forma 1.</li><li><b>¿Tiene sentido?</b> Compara la respuesta con la probabilidad inicial (a priori) y explica por qué subió o bajó.</li></ol><div class=\"nota\">Si no escribes la respuesta en palabras, el ejercicio no está terminado: el número solo no dice qué evento representa.</div>"},{"t":"Ejercicio 1 · Salón de 40 estudiantes (condicional directa)","h":"<p>En un salón de 40 estudiantes hay 24 mujeres y 16 hombres. Practican fútbol 10 de las mujeres y 4 de los hombres. Si se elige al azar a alguien que practica fútbol, ¿cuál es la probabilidad de que sea mujer?</p><p><b>Qué significa cada letra</b></p><ul><li><b>M:</b> la persona es mujer.</li><li><b>F:</b> la persona practica fútbol.</li><li><b>P(M | F):</b> probabilidad de que sea mujer dado que practica fútbol (la barra significa «dado que»).</li><li><b>Intersección ∩:</b> significa «y». P(M ∩ F) es la probabilidad de ser mujer y practicar fútbol.</li></ul><p><b>Pasos</b></p><ol><li><b>Clasificar:</b> «si se elige a alguien que practica fútbol» ya fija una condición y hay conteos: condicional directa. Piden P(M | F): lo que se quiere (M) va antes de la barra y lo que ya se sabe (F) después.</li><li><b>P(M ∩ F):</b> mujeres que practican fútbol, 10 de 40 personas: 10/40.</li><li><b>P(F):</b> practican fútbol 10 mujeres + 4 hombres = 14 de 40: 14/40.</li><li><b>Aplicar la fórmula:</b> P(M | F) = P(M ∩ F) / P(F) = (10/40)/(14/40) = 10/14 = <b>5/7 ≈ 0.714</b>.</li><li><b>Comprobar con el universo reducido:</b> entre los 14 que juegan fútbol, 10 son mujeres: 10/14 (el 40 se cancela).</li></ol><div class=\"regla\">Respuesta: la probabilidad de que sea mujer, sabiendo que practica fútbol, es 5/7 ≈ 0.714.</div>"},{"t":"Ejercicio 2 · Dos máquinas y piezas defectuosas (Bayes)","h":"<p>Una fábrica tiene dos máquinas: la A produce el 60% de las piezas y la B el 40%. El 3% de las piezas de A y el 5% de las de B salen defectuosas. Se toma una pieza al azar y resulta defectuosa. ¿Cuál es la probabilidad de que venga de B?</p><p><b>Qué significa cada letra</b></p><ul><li><b>MA, MB:</b> la pieza viene de la máquina A / de la máquina B.</li><li><b>D:</b> la pieza es defectuosa.</li><li><b>P(MB | D):</b> probabilidad de que la pieza venga de B dado que es defectuosa (la barra significa «dado que»).</li><li><b>Intersección ∩:</b> significa «y». P(MB ∩ D) es la probabilidad de venir de B y ser defectuosa.</li></ul><p><b>Pasos</b></p><ol><li><b>Clasificar:</b> dan P(D | máquina) y piden P(MB | D): los mismos eventos intercambiados, de la pieza observada (defectuosa) a la máquina de origen. Es Bayes.</li><li><b>Datos:</b> P(MA) = 0.60, P(MB) = 0.40, P(D | MA) = 0.03, P(D | MB) = 0.05.</li><li><b>Numerador:</b> P(MB ∩ D) = P(MB) · P(D | MB) = 0.40 · 0.05 = 0.020.</li><li><b>Otro camino a defectuosa:</b> P(MA ∩ D) = P(MA) · P(D | MA) = 0.60 · 0.03 = 0.018.</li><li><b>Denominador (probabilidad total):</b> P(D) = 0.018 + 0.020 = 0.038.</li><li><b>Bayes:</b> P(MB | D) = 0.020/0.038 = <b>10/19 ≈ 0.526</b>.</li><li><b>Verificar:</b> P(MA | D) = 0.018/0.038 = 9/19, y 10/19 + 9/19 = 1.</li><li><b>Interpretar:</b> la B produce el 40% de las piezas pero explica el 52.6% de los defectos: pasa de 0.40 (a priori) a 0.526 (a posteriori).</li></ol><div class=\"regla\">Respuesta: la probabilidad de que la pieza defectuosa venga de la máquina B es 10/19 ≈ 0.526.</div>"},{"t":"Ejercicio 3 · Dos lanzamientos de un dado (condicional directa)","h":"<p>Se lanza un dado justo dos veces. Si se sabe que la suma fue 8, ¿cuál es la probabilidad de que el primer lanzamiento haya sido un 4?</p><p><b>Qué significa cada letra</b></p><ul><li><b>S8:</b> la suma de los dos dados es 8.</li><li><b>P4:</b> el primer dado fue 4.</li><li><b>(a, b):</b> el primer dado salió a y el segundo b.</li><li><b>P(P4 | S8):</b> probabilidad de que el primer dado sea 4 dado que la suma fue 8 (la barra significa «dado que»).</li><li><b>Intersección ∩:</b> significa «y». P(P4 ∩ S8) es la probabilidad de que el primero sea 4 y la suma sea 8.</li></ul><p><b>Pasos</b></p><ol><li><b>Clasificar:</b> «la suma fue 8» ya ocurrió y se puede contar en el espacio muestral: condicional directa. Piden P(P4 | S8).</li><li><b>Espacio muestral:</b> 6 · 6 = 36 resultados equiprobables.</li><li><b>P(S8):</b> suman 8 (2,6), (3,5), (4,4), (5,3) y (6,2): 5 resultados, P(S8) = 5/36.</li><li><b>P(P4 ∩ S8):</b> solo (4,4) tiene un 4 primero y suma 8: P(P4 ∩ S8) = 1/36.</li><li><b>Aplicar la fórmula:</b> P(P4 | S8) = (1/36)/(5/36) = <b>1/5 = 0.20</b>.</li><li><b>Comprobar con el universo reducido:</b> el universo baja de 36 a 5 resultados y (4,4) es 1 de los 5. Sin la información, P(P4) = 1/6.</li></ol><div class=\"regla\">Respuesta: la probabilidad de que el primer dado haya sido 4, sabiendo que la suma fue 8, es 1/5 = 0.20.</div>"},{"t":"Ejercicio 4 · Prueba diagnóstica (Bayes)","h":"<p>El 2% de una población tiene cierta condición. Una prueba da positivo en el 98% de las personas que la tienen y en el 5% de las que no la tienen. Si una persona da positivo, ¿cuál es la probabilidad de que realmente tenga la condición?</p><p><b>Qué significa cada letra</b></p><ul><li><b>C:</b> la persona tiene la condición. <b>noC:</b> no la tiene.</li><li><b>+:</b> la prueba da positivo.</li><li><b>P(C | +):</b> probabilidad de tener la condición dado que la prueba da positivo (la barra significa «dado que»).</li><li><b>Intersección ∩:</b> significa «y». P(C ∩ +) es la probabilidad de tener la condición y dar positivo.</li></ul><p><b>Pasos</b></p><ol><li><b>Clasificar:</b> dan P(+ | C) y P(+ | noC) y piden P(C | +): los mismos eventos intercambiados. Es Bayes.</li><li><b>Datos:</b> P(C) = 0.02, P(noC) = 0.98, P(+ | C) = 0.98, P(+ | noC) = 0.05.</li><li><b>Numerador:</b> P(C ∩ +) = P(C) · P(+ | C) = 0.02 · 0.98 = 0.0196.</li><li><b>Otro camino a positivo:</b> P(noC ∩ +) = P(noC) · P(+ | noC) = 0.98 · 0.05 = 0.0490.</li><li><b>Denominador (probabilidad total):</b> P(+) = 0.0196 + 0.0490 = 0.0686.</li><li><b>Bayes:</b> P(C | +) = 0.0196/0.0686 = <b>2/7 ≈ 0.286</b>.</li><li><b>Verificar:</b> P(noC | +) = 0.0490/0.0686 = 5/7, y 2/7 + 5/7 = 1.</li><li><b>Comprobar con 1000 personas:</b> 20 tienen la condición (2%) y 980 no. De los 20, dan positivo 19.6 (98%); de los 980, dan positivo 49 (5%). Hay 19.6 + 49 = 68.6 positivos y 19.6 / 68.6 = 2/7.</li></ol><div class=\"regla\">Respuesta: si la prueba da positivo, la probabilidad de tener la condición es 2/7 ≈ 0.286.</div>"},{"t":"Ejercicio 5 · Dos cartas sin reemplazo (condicional directa)","h":"<p>Se sacan dos cartas, una tras otra y sin reemplazo, de una baraja de 52. ¿Cuál es la probabilidad de que la segunda sea un as, sabiendo que la primera fue un as?</p><p><b>Qué significa cada letra</b></p><ul><li><b>A1, A2:</b> la 1.ª / 2.ª carta es as.</li><li><b>P(A2 | A1):</b> probabilidad de que la 2.ª carta sea as dado que la 1.ª fue as (la barra significa «dado que»).</li><li><b>Intersección ∩:</b> significa «y». P(A1 ∩ A2) es la probabilidad de que las dos sean ases.</li></ul><p><b>Pasos</b></p><ol><li><b>Clasificar:</b> «sabiendo que la 1.ª fue as» ya fija el condicionante, y la pregunta va en el mismo sentido de la historia: condicional directa. Piden P(A2 | A1).</li><li><b>Grupo que queda:</b> salió un as y no se devuelve, así que quedan 51 cartas y 3 ases.</li><li><b>Calcular:</b> P(A2 | A1) = 3/51 = <b>1/17 ≈ 0.0588</b>.</li><li><b>Comprobar con la fórmula:</b> P(A2 | A1) = P(A1 ∩ A2) / P(A1) = [(4/52)(3/51)] / (4/52) = 3/51.</li></ol><div class=\"regla\">Respuesta: la probabilidad de que la 2.ª carta sea as, sabiendo que la 1.ª fue as, es 1/17 ≈ 0.0588.</div>"},{"t":"Ejercicio 6 · Filtro de spam (Bayes)","h":"<p>El 70% de los correos que recibe una persona son legítimos y el 30% son spam. El filtro marca como spam al 90% de los spam y al 4% de los legítimos. Llega un correo marcado como spam. ¿Cuál es la probabilidad de que sea legítimo?</p><p><b>Qué significa cada letra</b></p><ul><li><b>L:</b> el correo es legítimo. <b>S:</b> el correo es spam.</li><li><b>M:</b> el filtro marca el correo como spam.</li><li><b>P(L | M):</b> probabilidad de que sea legítimo dado que fue marcado (la barra significa «dado que»).</li><li><b>Intersección ∩:</b> significa «y». P(L ∩ M) es la probabilidad de ser legítimo y estar marcado.</li></ul><p><b>Pasos</b></p><ol><li><b>Clasificar:</b> dan P(M | tipo) y piden P(L | M): los mismos eventos intercambiados. Es Bayes. La trampa: la causa buscada es «legítimo», no «spam».</li><li><b>Datos:</b> P(L) = 0.70, P(S) = 0.30, P(M | S) = 0.90, P(M | L) = 0.04.</li><li><b>Numerador:</b> P(L ∩ M) = P(L) · P(M | L) = 0.70 · 0.04 = 0.028.</li><li><b>Otro camino a marcado:</b> P(S ∩ M) = P(S) · P(M | S) = 0.30 · 0.90 = 0.270.</li><li><b>Denominador (probabilidad total):</b> P(M) = 0.270 + 0.028 = 0.298.</li><li><b>Bayes:</b> P(L | M) = 0.028/0.298 = <b>14/149 ≈ 0.094</b>.</li><li><b>Verificar:</b> P(S | M) = 0.270/0.298 = 135/149 ≈ 0.906, y 14/149 + 135/149 = 1.</li></ol><div class=\"regla\">Respuesta: si el correo está marcado, la probabilidad de que sea legítimo es 14/149 ≈ 0.094.</div>"},{"t":"Ejercicio 7 · Ascensos en una empresa (condicional directa con trampa)","h":"<p>En una empresa de 200 empleados, 80 trabajan de forma remota y 120 de forma presencial. Fueron ascendidos 20 de los remotos y 18 de los presenciales. Si se elige a un empleado que fue ascendido, ¿cuál es la probabilidad de que trabaje de forma remota?</p><p><b>Qué significa cada letra</b></p><ul><li><b>R:</b> el empleado es remoto. <b>P:</b> es presencial.</li><li><b>As:</b> el empleado fue ascendido.</li><li><b>P(R | As):</b> probabilidad de ser remoto dado que fue ascendido (la barra significa «dado que»).</li><li><b>Intersección ∩:</b> significa «y». P(R ∩ As) es la probabilidad de ser remoto y ascendido.</li></ul><p><b>Pasos</b></p><ol><li><b>Clasificar:</b> hay conteos: la intersección (20) y el total de ascendidos (38) están a la vista, así que manda la condicional directa aunque la pregunta vaya «hacia atrás». Piden P(R | As).</li><li><b>Armar los conteos:</b> remotos 80 (20 ascendidos y 60 no); presenciales 120 (18 ascendidos y 102 no); total 200. Ascendidos: 20 + 18 = 38.</li><li><b>P(R ∩ As):</b> 20 de 200: 20/200.</li><li><b>P(As):</b> 38 de 200: 38/200.</li><li><b>Aplicar la fórmula:</b> P(R | As) = (20/200)/(38/200) = 20/38 = <b>10/19 ≈ 0.526</b>.</li><li><b>Comprobar con Bayes:</b> P(R) = 0.40, P(P) = 0.60, P(As | R) = 20/80 = 0.25, P(As | P) = 18/120 = 0.15. P(As) = 0.25 · 0.40 + 0.15 · 0.60 = 0.19 y P(R | As) = 0.10/0.19 = 10/19.</li></ol><div class=\"regla\">Respuesta: si se elige a un ascendido, la probabilidad de que sea remoto es 10/19 ≈ 0.526.</div>"},{"t":"Ejercicio 8 · Tres urnas (Bayes con tres causas)","h":"<p>Hay tres urnas: U1 tiene 2 bolas rojas y 3 azules, U2 tiene 4 rojas y 1 azul, U3 tiene 3 rojas y 3 azules. Se elige una urna al azar y de ella se saca una bola. Si la bola es roja, ¿cuál es la probabilidad de que venga de U2?</p>\n<ol>\n<li><b>Clasificar:</b> hay evidencia observada («si es roja») y piden la causa (la urna): es Bayes con tres causas. R = la bola es roja; Ui = la bola viene de la urna i.</li>\n<li><b>Probabilidad de cada urna:</b> se elige al azar entre 3, así que P(U1) = P(U2) = P(U3) = 1/3.</li>\n<li><b>P(R | Ui)</b> = rojas / total de bolas de esa urna: P(R | U1) = 2/5, P(R | U2) = 4/5, P(R | U3) = 3/6 = 1/2.</li>\n<li><b>Numerador de cada urna,</b> P(Ui) · P(R | Ui): U1 = (1/3)(2/5) = 4/30; U2 = (1/3)(4/5) = 8/30; U3 = (1/3)(1/2) = 5/30.</li>\n<li><b>Denominador</b> (probabilidad total): P(R) = 4/30 + 8/30 + 5/30 = 17/30.</li>\n<li><b>Bayes:</b> P(U2 | R) = P(U2) · P(R | U2) / P(R) = (8/30)/(17/30) = <b>8/17 ≈ 0.471</b>.</li>\n<li><b>Verificar:</b> las tres urnas suman 1: 4/17 + 8/17 + 5/17 = 17/17.</li>\n</ol>\n<p><b>Cómo se lee la tabla:</b> cada fila es una causa; la 4.ª columna es la 2.ª por la 3.ª, y la 5.ª es la 4.ª entre el total 17/30.</p>\n<table><tr><th>Urna</th><th>P(urna)</th><th>P(R | urna)</th><th>P(urna) · P(R | urna)</th><th>P(urna | R)</th></tr><tr><td>U1</td><td>1/3</td><td>2/5</td><td>4/30</td><td>4/17 ≈ 0.235</td></tr><tr><td>U2</td><td>1/3</td><td>4/5</td><td>8/30</td><td>8/17 ≈ 0.471</td></tr><tr><td>U3</td><td>1/3</td><td>1/2</td><td>5/30</td><td>5/17 ≈ 0.294</td></tr><tr><td>Total</td><td>1</td><td></td><td>17/30</td><td>17/17 = 1</td></tr></table><div class=\"regla\">Respuesta: si la bola es roja, la probabilidad de que venga de U2 es 8/17 ≈ 0.471.</div>"},{"t":"Ejercicio 9 · Urna sin reemplazo: 2.ª y 3.ª bola blancas (multiplicación + total)","h":"<p>Una urna contiene 3 bolas negras y 2 blancas y se van extrayendo sin reemplazarlas. ¿Cuál es la probabilidad de que la segunda bola sea blanca? ¿Cuál es la probabilidad de que la tercera sea blanca?</p>\n<p><b>Qué significa cada letra</b></p>\n<ul>\n<li><b>N1, N2, N3:</b> la 1.ª, 2.ª y 3.ª bola es negra.</li>\n<li><b>B1, B2, B3:</b> la 1.ª, 2.ª y 3.ª bola es blanca.</li>\n<li><b>P(B2 | B1):</b> probabilidad de que la 2.ª sea blanca dado que la 1.ª fue blanca (la barra significa «dado que»).</li>\n<li><b>Intersección ∩:</b> significa «y». Por ejemplo, P(N1 ∩ N2 ∩ B3) es la probabilidad de que la 1.ª sea negra, la 2.ª negra y la 3.ª blanca.</li>\n<li><b>En los caminos de la parte 2,</b> (N, N, B) da el color de la 1.ª, 2.ª y 3.ª bola, en ese orden.</li>\n</ul>\n<p><b>Parte 1: ¿la 2.ª es blanca?</b></p>\n<ol start=\"0\">\n<li><b>Clasificar:</b> no hay evidencia observada (nadie dice «dado que»), así que no es condicional directa ni Bayes: multiplicación + probabilidad total.</li>\n<li><b>Caminos:</b> la 2.ª es blanca de dos maneras, con la 1.ª blanca (B1 ∩ B2) o con la 1.ª negra (N1 ∩ B2). Son excluyentes entre sí.</li>\n<li><b>Multiplicar cada camino:</b> P(B1 ∩ B2) = P(B1) · P(B2 | B1) = (2/5)(1/4), porque tras sacar una blanca quedan 4 bolas y 1 blanca. P(N1 ∩ B2) = P(N1) · P(B2 | N1) = (3/5)(2/4), porque tras sacar una negra quedan 4 bolas y 2 blancas.</li>\n<li><b>Sumar:</b> P(B2) = 2/20 + 6/20 = 8/20 = <b>2/5</b>.</li>\n</ol>\n<p><b>Parte 2: ¿la 3.ª es blanca?</b></p>\n<ol>\n<li><b>Caminos:</b> las dos primeras bolas pueden ser (N,N), (N,B), (B,N) o (B,B), y en cada caso la 3.ª es blanca.</li>\n<li><b>Cada camino</b> es un producto de tres factores: P(1.ª) · P(2.ª | 1.ª) · P(3.ª | las dos anteriores). En (N, N, B): 3/5 de negra, luego 2/4 de negra, luego quedan 3 bolas y 2 blancas, 2/3. En (B, B, B): al salir las 2 blancas ya no quedan, por eso el último factor es 0/3.</li>\n</ol>\n<ol type=\"a\">\n<li><b>N, N, B:</b> P(N1 ∩ N2 ∩ B3) = P(N1) · P(N2 | N1) · P(B3 | N1 ∩ N2) = (3/5)(2/4)(2/3) = 1/5.<br>3 negras de 5; sacada una negra quedan 2 negras de 4; sacadas dos negras quedan 2 blancas de 3.</li>\n<li><b>N, B, B:</b> P(N1 ∩ B2 ∩ B3) = P(N1) · P(B2 | N1) · P(B3 | N1 ∩ B2) = (3/5)(2/4)(1/3) = 1/10.<br>3 negras de 5; sacada una negra quedan 2 blancas de 4; sacadas una negra y una blanca queda 1 blanca de 3.</li>\n<li><b>B, N, B:</b> P(B1 ∩ N2 ∩ B3) = P(B1) · P(N2 | B1) · P(B3 | B1 ∩ N2) = (2/5)(3/4)(1/3) = 1/10.<br>2 blancas de 5; sacada una blanca quedan 3 negras de 4; sacadas una blanca y una negra queda 1 blanca de 3.</li>\n<li><b>B, B, B:</b> P(B1 ∩ B2 ∩ B3) = P(B1) · P(B2 | B1) · P(B3 | B1 ∩ B2) = (2/5)(1/4)(0/3) = 0.<br>Al salir las 2 blancas ya no queda ninguna para la 3.ª.</li>\n</ol>\n<ol start=\"3\">\n<li><b>Sumar los caminos:</b> P(B3) = 12/60 + 6/60 + 6/60 + 0 = 24/60 = <b>2/5</b>, la misma que P(B1).</li>\n<li><b>Dependencia:</b> no son independientes, porque P(B2 | B1) = 1/4 y P(B2 | N1) = 2/4, y ninguna es igual a P(B2) = 2/5.</li>\n</ol>\n<p><b>Variante que sí sería Bayes:</b> «si la 3.ª salió blanca, ¿probabilidad de que la 1.ª haya sido negra?»</p>\n<ol>\n<li><b>Clasificar:</b> la evidencia es B3 (después de la barra) y la incógnita es N1 (antes de la barra): piden P(N1 | B3).</li>\n<li><b>Numerador:</b> P(N1 ∩ B3) = (N, N, B) + (N, B, B) = 1/5 + 1/10 = 3/10.</li>\n<li><b>Denominador:</b> P(B3) = 2/5.</li>\n<li><b>Dividir:</b> P(N1 | B3) = (3/10)/(2/5) = <b>3/4</b>.</li>\n</ol><div class=\"regla\">Respuesta: P(B2) = 2/5; P(B3) = 2/5; y si la 3.ª salió blanca, la probabilidad de que la 1.ª haya sido negra es P(N1 | B3) = 3/4.</div>"},{"t":"Resumen de clasificación (ejercicios 3 al 9)","h":"<table><tr><th>Ej.</th><th>Situación</th><th>Método</th><th>Qué lo decide</th></tr><tr><td>3</td><td>Dos lanzamientos de un dado; se sabe la suma; se pide algo del primero</td><td>Condicional directa</td><td>Se cuentan casos directo en el espacio muestral; la suma observada va después de la barra</td></tr><tr><td>4</td><td>Prueba positiva y enfermedad</td><td>Bayes</td><td>Dan P(+ | condición) y piden P(condición | +): mismos eventos, invertidos</td></tr><tr><td>5</td><td>Dos cartas sin reemplazo; la 1.ª fue as, ¿la 2.ª?</td><td>Condicional directa</td><td>La pregunta va en el mismo sentido de la historia y el «sabiendo que» ya fija el condicionante</td></tr><tr><td>6</td><td>Filtro de spam; correo marcado, ¿es legítimo?</td><td>Bayes</td><td>Dan P(marcado | tipo) y piden P(tipo | marcado); la causa buscada es «legítimo»</td></tr><tr><td>7</td><td>Remotos/presenciales y ascensos (conteos)</td><td>Condicional directa</td><td>Hay conteos; la intersección está a la vista (Bayes daría lo mismo)</td></tr><tr><td>8</td><td>Tres urnas, bola roja, ¿de cuál urna?</td><td>Bayes</td><td>Dan P(roja | urna) y piden P(urna | roja)</td></tr><tr><td>9</td><td>Urna sin reemplazo; ¿2.ª y 3.ª bolas blancas?</td><td>Multiplicación + probabilidad total</td><td>No hay evidencia observada; sin reemplazo no son independientes; se suman los caminos</td></tr></table>"}]}];
const EJ = [{"t": "Hoja 1 · Probabilidad condicional", "intro": "Antes de calcular: ¿qué va antes de la barra y qué va después? ¿Te piden una intersección o una condicional? Tiempo sugerido: 40 min, sin la guía.", "nota": "Sin calculadora para las fracciones: deja el resultado simplificado y, si quieres, su valor decimal.", "items": [["1.1", "Se lanza un par de dados justos. Si se sabe que la suma fue 9, ¿cuál es la probabilidad de que al menos uno de los dados haya salido 6?", []], ["1.2", "En un grupo de 150 estudiantes hay 90 hombres y 60 mujeres. Van en bicicleta a la escuela 30 hombres y 24 mujeres.", ["a) Si se elige a alguien que va en bicicleta, ¿cuál es la probabilidad de que sea mujer?", "b) Si se elige a una mujer, ¿cuál es la probabilidad de que vaya en bicicleta?", "c) ¿Por qué a) y b) no dan lo mismo? Explícalo con tus palabras."]], ["1.3", "Una urna tiene 7 bolas rojas y 5 negras. Se extraen 3 bolas, una tras otra y sin reemplazo.", ["a) ¿Cuál es la probabilidad de que las tres sean rojas?", "b) Si la primera fue roja, ¿cuál es la probabilidad de que las otras dos sean negras?"]], ["1.4", "Se lanza un dado justo. Sean A = «sale par», B = «sale mayor que 3» y C = «sale múltiplo de 3».", ["a) ¿A y B son independientes? Justifica.", "b) ¿A y C son independientes? Justifica.", "c) Usa tu respuesta de b) para calcular P(A ∩ C<sup>c</sup>) sin contar, y compruébalo contando."]], ["1.5", "Sean A y B eventos con P(A) = 0.5, P(B) = 0.4 y P(A ∪ B) = 0.7. Encuentra P(A ∩ B) y P(A | B), y decide si A y B son independientes.", []], ["1.6", "Se lanzan dos monedas justas. Si se sabe que salió al menos una cara, ¿cuál es la probabilidad de que ambas hayan sido cara?", []], ["1.7", "De una baraja de 52 cartas se sacan dos, una tras otra y sin reemplazo.", ["a) ¿Cuál es la probabilidad de que ambas sean corazones?", "b) Dado que la primera no fue corazón, ¿cuál es la probabilidad de que la segunda sí lo sea?"]]]}, {"t": "Hoja 2 · Teorema de Bayes y probabilidad total", "intro": "Escribe cada dato como P(X | Y), clasifica (¿directa, Bayes o multiplicación + total?) y verifica que las causas sumen 1. Tiempo sugerido: 40 min.", "nota": "Trampa a vigilar: en algunos incisos no hay evidencia observada, así que no son Bayes.", "items": [["2.1", "Una tienda recibe laptops de tres proveedores: P1 envía el 50%, P2 el 30% y P3 el 20%. Salen defectuosas el 1% de las de P1, el 4% de las de P2 y el 5% de las de P3.", ["a) ¿Cuál es la probabilidad de que una laptop elegida al azar sea defectuosa?", "b) Se elige una y resulta defectuosa: ¿cuál es la probabilidad de que venga de P3?", "c) ¿De qué proveedor es más probable que venga?"]], ["2.2", "El 1% de una población tiene cierta enfermedad. Una prueba da positivo en el 90% de los enfermos y en el 8% de los sanos.", ["a) Si una persona da positivo, ¿cuál es la probabilidad de que realmente esté enferma?", "b) Si da negativo, ¿cuál es la probabilidad de que realmente esté sana?"]], ["2.3", "Se lanza una moneda justa: si sale cara se elige la urna I (3 bolas blancas y 2 negras); si sale sello, la urna II (1 blanca y 4 negras). Luego se saca una bola de la urna elegida. Si la bola fue negra, ¿cuál es la probabilidad de que venga de la urna I?", []], ["2.4", "La caja 1 tiene 4 bolas rojas y 2 azules; la caja 2 tiene 3 rojas y 5 azules. Se pasa una bola al azar de la caja 1 a la caja 2 y luego se saca una bola de la caja 2.", ["a) ¿Cuál es la probabilidad de que la bola sacada sea roja?", "b) Si la bola sacada fue roja, ¿cuál es la probabilidad de que la bola transferida haya sido roja?"]], ["2.5", "Clasifica antes de resolver. De 120 alumnos, 70 hacen la tarea con regularidad y de ellos aprueban 63. De los 50 que no la hacen, aprueban 20. Si se elige a un alumno que aprobó, ¿cuál es la probabilidad de que haya hecho la tarea con regularidad? Di si es condicional directa o Bayes, resuélvelo y compruébalo con el otro método.", []], ["2.6", "Una urna tiene 4 bolas blancas y 3 negras; se extraen dos sin reemplazo.", ["a) ¿Cuál es la probabilidad de que la segunda sea blanca?", "b) Si la segunda fue blanca, ¿cuál es la probabilidad de que la primera haya sido negra?", "c) ¿Cuál de a) y b) es Bayes y cuál no? Explica por qué."]]]}, {"t": "Hoja 3 · Variado: palomar, inclusión/exclusión, φ y probabilidad", "intro": "Mezcla de temas, como en el parcial: identifica primero qué técnica pide cada ejercicio. Tiempo sugerido: 45 min.", "nota": "Para los de palomar: peor caso + 1. Para los de conteo: universo, conjuntos, intersecciones y signos alternados.", "items": [["3.1", "En un grupo de 100 personas,", ["a) ¿cuántas, como mínimo, tienen que compartir el mes de nacimiento?", "b) ¿Cuántas personas hacen falta para garantizar que 10 compartan mes?"]], ["3.2", "Una bolsa tiene 6 canicas rojas, 9 verdes, 4 azules y 10 amarillas. ¿Cuál es el mínimo de canicas que hay que sacar para garantizar 7 del mismo color?", []], ["3.3", "¿Cuántos enteros hay que escoger para garantizar que dos tengan el mismo residuo al dividir entre 7? ¿Y para garantizar que tres tengan el mismo residuo?", []], ["3.4", "De los enteros del 1 al 500:", ["a) ¿cuántos son múltiplos de 4 o de 6?", "b) ¿Cuántos no son divisibles ni por 4 ni por 6?"]], ["3.5", "", ["a) Calcula φ(360) con la fórmula rápida.", "b) ¿Cuántos enteros de 1 a 360 no son primos relativos a 360?", "c) Comprueba a) con inclusión/exclusión."]], ["3.6", "Se elige al azar un entero del 1 al 100. ¿Cuál es la probabilidad de que sea divisible por 2, por 3 o por 5? ¿Y de que no sea divisible por ninguno?", []], ["3.7", "Sean A y B eventos con P(A) = 0.6, P(B) = 0.5 y P(A ∩ B) = 0.3. Calcula P(A ∪ B), P(A ∩ B<sup>c</sup>) y la probabilidad de que no ocurra ninguno de los dos. ¿Son independientes?", []]]}];
let CONCEPTOS, REPASO;


const $ = (s) => document.querySelector(s);
const barajar = (l) => [...l].sort(() => Math.random() - 0.5);
const limpiar = (t) => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const solo = (t) => limpiar(t).replace(/[^a-z0-9]/g, "");
const esc = (t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

/* ---------- Memoria ---------- */
let tema = 0, cola, dom, intentos, resuelta = false;
const ME = {}, KS = {};
var terminado = false;
function reiniciar() { cola = barajar(CONCEPTOS.map((_, i) => i)); dom = 0; intentos = 0; }
function distractores(item) {
  const pal = (s) => limpiar(s).split(/[^a-z0-9]+/).filter(Boolean);
  const sim = (a, b) => { const A = pal(a), B = pal(b), x = solo(a), y = solo(b); let i = 0; while (i < x.length && i < y.length && x[i] === y[i]) i++; return A.filter((w) => B.includes(w)).length * 2 + i / 4 + Math.random(); };
  return CONCEPTOS.filter((o) => o !== item).sort((a, b) => sim(item[0], b[0]) - sim(item[0], a[0])).slice(0, 3);
}
function progreso() {
  $("#progreso").textContent = `Dominadas ${dom} de ${CONCEPTOS.length}. Intentos: ${intentos}`;
  $("#avance").style.width = `${(dom / CONCEPTOS.length) * 100}%`;
}
function mostrar() {
  terminado = false; resuelta = false; progreso();
  $("#msg").className = ""; $("#sig").hidden = true; $("#opciones").innerHTML = "";
  if (!cola.length) {
    $("#etq").textContent = TEMAS[tema].n;
    $("#pregunta").textContent = `¡Listo! Dominaste los ${CONCEPTOS.length} conceptos con ${intentos} intentos.`;
    $("#def").hidden = true; $("#sig").textContent = "Empezar de nuevo"; $("#sig").hidden = false; resuelta = true; terminado = true; return;
  }
  const item = CONCEPTOS[cola[0]];
  $("#etq").textContent = TEMAS[tema].n;
  $("#pregunta").textContent = "¿A qué concepto corresponde esta definición?";
  $("#def").hidden = false;
  $("#def").textContent = item[1].replace(new RegExp("(?<![\\p{L}\\p{N}_])" + esc(item[0]) + "(?![\\p{L}\\p{N}_])", "giu"), "____");
  barajar([item, ...distractores(item)]).forEach((o) => {
    const b = document.createElement("button"); b.textContent = o[0]; b.onclick = () => elegir(b, o); $("#opciones").appendChild(b);
  });
  $("#sig").textContent = "Siguiente";
}
function elegir(btn, op) {
  if (resuelta) return;
  const item = CONCEPTOS[cola[0]], ok = op === item; intentos++; resuelta = true;
  [...$("#opciones").children].forEach((b) => { b.disabled = true; if (b.textContent === item[0]) b.classList.add("ok"); });
  const m = $("#msg");
  if (ok) { cola.shift(); dom++; m.className = "ok"; m.textContent = `Correcto: ${item[0]}.\n${item[1]}`; }
  else { btn.classList.add("mal"); cola.push(cola.shift()); m.className = "mal"; m.textContent = `Incorrecto. Era: ${item[0]}.\n${item[1]}\n(esta tarjeta volverá a salir)`; }
  m.style.whiteSpace = "pre-wrap"; progreso(); $("#sig").hidden = false; $("#sig").focus();
}
$("#sig").onclick = () => { if (terminado) reiniciar(); mostrar(); };

/* ---------- Repaso ---------- */
let k = 0;
function repaso() {
  $("#contenido").innerHTML = `<span class="etiqueta">Repaso ${k + 1} de ${REPASO.length}</span><h2>${REPASO[k].t}</h2>${REPASO[k].h}`;
  [...$("#chips").children].forEach((b, i) => b.setAttribute("aria-current", i === k));
  $("#ant").disabled = k === 0; $("#prox").disabled = k === REPASO.length - 1;
  window.scrollTo({ top: 0 });
}
function chips() {
  $("#chips").innerHTML = "";
  REPASO.forEach((_, i) => { const b = document.createElement("button"); b.textContent = i + 1; b.onclick = () => { k = i; repaso(); }; $("#chips").appendChild(b); });
}
$("#ant").onclick = () => { if (k > 0) { k--; repaso(); } };
$("#prox").onclick = () => { if (k < REPASO.length - 1) { k++; repaso(); } };
document.addEventListener("keydown", (e) => { if ($("#rep").hidden) return; if (e.key === "ArrowLeft") $("#ant").click(); if (e.key === "ArrowRight") $("#prox").click(); });

/* ---------- Pestañas ---------- */
function modo(m) {
  $("#mem").hidden = m !== "mem"; $("#rep").hidden = m !== "rep"; $("#ej").hidden = m !== "ej";
  $(".fila-tema").hidden = m === "ej"; $("#m-ej").setAttribute("aria-selected", m === "ej");
  $("#m-mem").setAttribute("aria-selected", m === "mem"); $("#m-rep").setAttribute("aria-selected", m === "rep");
  if (m === "rep") repaso();
  if (m === "ej") { ejercicios(); window.scrollTo({ top: 0 }); }
}
$("#m-mem").onclick = () => modo("mem"); $("#m-rep").onclick = () => modo("rep"); $("#m-ej").onclick = () => modo("ej");
function ejercicios() {
  $("#ej").innerHTML = EJ.map((hoja) => `<div class="tarjeta hoja"><h2>${hoja.t}</h2><p class="indic">${hoja.intro}</p><ol>${hoja.items.map(([n, txt, partes]) => `<li class="ejercicio"><span class="num">${n}</span>${txt}${partes.length ? `<div class="partes">${partes.map((p) => `<p>${p}</p>`).join("")}</div>` : ""}</li>`).join("")}</ol><p class="indic">${hoja.nota}</p></div>`).join("");
}
function cambiarTema(i) {
  if (cola) { ME[tema] = { cola, dom, intentos }; KS[tema] = k; }
  tema = i; CONCEPTOS = TEMAS[i].c; REPASO = TEMAS[i].r;
  const s = ME[i];
  if (s) { cola = s.cola; dom = s.dom; intentos = s.intentos; } else reiniciar();
  k = KS[i] || 0; chips(); mostrar();
  if (!$("#rep").hidden) repaso();
}
TEMAS.forEach((t, i) => { const o = document.createElement("option"); o.value = i; o.textContent = t.n; $("#menu").appendChild(o); });
$("#menu").addEventListener("change", (e) => cambiarTema(Number(e.target.value)));
cambiarTema(0);
</script>
